        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef sign_modelcar(\n    image_ref_artifact: dsl.Input[dsl.Artifact],\n\
          \    cosign_key_path:    str = \"/etc/cosign/cosign.key\",\n    rekor_url:\
          \          str = \"https://rekor-server-trusted-artifact-signer.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com\"\
          ,\n) -> str:\n    \"\"\"cosign sign the modelcar by digest. Uses the same\
          \ static keypair + RHTAS\n    Rekor as the Tekton OS-image pipeline (D008/D022).\"\
          \"\"\n    import subprocess, pathlib, json, os\n\n    art_dir   = pathlib.Path(image_ref_artifact.path)\n\
          \    meta      = json.loads((art_dir / \"image_ref.json\").read_text())\n\
          \    image_ref = meta[\"image_ref\"]\n\n    print(f\"[sign] cosign sign\
          \ {image_ref}\")\n    env = os.environ.copy()\n    env[\"COSIGN_PASSWORD\"\
          ] = \"\"  # key is unencrypted in the Secret (matches D008)\n    subprocess.run([\n\
          \        \"cosign\", \"sign\",\n        \"--key\",        cosign_key_path,\n\
          \        \"--rekor-url\",  rekor_url,\n        \"--tlog-upload=true\",\n\
          \        \"-y\",\n        image_ref,\n    ], check=True, env=env)\n    print(f\"\
          [sign] signed -> Rekor entry logged\")\n    return image_ref\n\n"
        image: gcr.io/projectsigstore/cosign:v2.6.5
pipelineInfo:
  description: 'Phase 4 training pipeline: ingest curated episodes -> LoRA fine-tune
    Cosmos3-Edge -> Gate 1 eval -> package modelcar -> cosign sign -> open promotion
    PR'
  name: cosmos3-edge-finetune
root:
  dag:
    tasks:
      evaluate:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate
        dependentTasks:
        - finetune-cosmos3
        - ingest-episodes
        inputs:
          artifacts:
            checkpoint:
              taskOutputArtifact:
                outputArtifactKey: checkpoint_out
                producerTask: finetune-cosmos3
            episodes:
              taskOutputArtifact:
                outputArtifactKey: episodes_out
                producerTask: ingest-episodes
          parameters:
            threshold_good_sel_rate:
              componentInputParameter: threshold_good_sel_rate
            threshold_loss:
              componentInputParameter: threshold_loss
            threshold_parse_rate:
              componentInputParameter: threshold_parse_rate
        taskInfo:
          name: evaluate
      finetune-cosmos3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-finetune-cosmos3
        dependentTasks:
        - ingest-episodes
        inputs:
          artifacts:
            episodes:
              taskOutputArtifact:
                outputArtifactKey: episodes_out
                producerTask: ingest-episodes
          parameters:
            learning_rate:
              componentInputParameter: learning_rate
            max_steps:
              componentInputParameter: max_steps
            model_id:
              componentInputParameter: model_id
        taskInfo:
          name: finetune-cosmos3
      gate2-dream-comparison:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-gate2-dream-comparison
        dependentTasks:
        - evaluate
        inputs:
          artifacts:
            eval_report:
              taskOutputArtifact:
                outputArtifactKey: report_out
                producerTask: evaluate
          parameters:
            model_version_v1:
              runtimeValue:
                constant: cosmos3-edge-v1
            model_version_v2:
              componentInputParameter: model_version
            s3_access_key:
              componentInputParameter: s3_access_key
            s3_endpoint:
              componentInputParameter: s3_endpoint
            s3_secret_key:
              componentInputParameter: s3_secret_key
        taskInfo:
          name: gate2-dream-comparison
      ingest-episodes:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-ingest-episodes
        inputs:
          parameters:
            s3_access_key:
              componentInputParameter: s3_access_key
            s3_bucket:
              componentInputParameter: s3_bucket
            s3_endpoint:
              componentInputParameter: s3_endpoint
            s3_secret_key:
              componentInputParameter: s3_secret_key
        taskInfo:
          name: ingest-episodes
      open-promotion-pr:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-open-promotion-pr
        dependentTasks:
        - gate2-dream-comparison
        - package-modelcar
        inputs:
          artifacts:
            eval_report:
              taskOutputArtifact:
                outputArtifactKey: gate2_report_out
                producerTask: gate2-dream-comparison
            image_ref_artifact:
              taskOutputArtifact:
                outputArtifactKey: image_ref_out
                producerTask: package-modelcar
          parameters:
            github_repo:
              componentInputParameter: github_repo
            model_version:
              componentInputParameter: model_version
        taskInfo:
          name: open-promotion-pr
      package-modelcar:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-package-modelcar
        dependentTasks:
        - evaluate
        - finetune-cosmos3
        inputs:
          artifacts:
            checkpoint:
              taskOutputArtifact:
                outputArtifactKey: checkpoint_out
                producerTask: finetune-cosmos3
            eval_report:
              taskOutputArtifact:
                outputArtifactKey: report_out
                producerTask: evaluate
          parameters:
            image_name:
              componentInputParameter: image_name
            model_version:
              componentInputParameter: model_version
            registry:
              componentInputParameter: registry
        taskInfo:
          name: package-modelcar
      sign-modelcar:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-sign-modelcar
        dependentTasks:
        - package-modelcar
        inputs:
          artifacts:
            image_ref_artifact:
              taskOutputArtifact:
                outputArtifactKey: image_ref_out
                producerTask: package-modelcar
        taskInfo:
          name: sign-modelcar
  inputDefinitions:
    parameters:
      github_repo:
        defaultValue: jeremyary/thor-testing
        isOptional: true
        parameterType: STRING
      image_name:
        defaultValue: thor-builds/cosmos3-edge-modelcar
        isOptional: true
        parameterType: STRING
      learning_rate:
        defaultValue: 5.0e-05
        isOptional: true
        parameterType: NUMBER_DOUBLE
      max_steps:
        defaultValue: 50.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      model_id:
        defaultValue: nvidia/Cosmos3-Edge
        isOptional: true
        parameterType: STRING
      model_version:
        defaultValue: cosmos3-edge-v2
        isOptional: true
        parameterType: STRING
      registry:
        defaultValue: default-route-openshift-image-registry.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com
        isOptional: true
        parameterType: STRING
      s3_access_key:
        defaultValue: admin
        isOptional: true
        parameterType: STRING
      s3_bucket:
        defaultValue: episodes-curated
        isOptional: true
        parameterType: STRING
      s3_endpoint:
        defaultValue: http://minio.robotics-data.svc:9000
        isOptional: true
        parameterType: STRING
      s3_secret_key:
        defaultValue: robotics-demo-2026
        isOptional: true
        parameterType: STRING
      threshold_good_sel_rate:
        defaultValue: 0.0
        isOptional: true
        parameterType: NUMBER_DOUBLE
      threshold_loss:
        defaultValue: 999.0
        isOptional: true
        parameterType: NUMBER_DOUBLE
      threshold_parse_rate:
        defaultValue: 0.0
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-finetune-cosmos3:
          podMetadata:
            labels:
              kueue.x-k8s.io/queue-name: robotics-train
          tolerations:
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Equal
            value: L40S_SHARED
        exec-open-promotion-pr:
          secretAsVolume:
          - mountPath: /etc/github
            optional: false
            secretName: github-token
            secretNameParameter:
              runtimeValue:
                constant: github-token
        exec-sign-modelcar:
          secretAsVolume:
          - mountPath: /etc/cosign
            optional: false
            secretName: cosign-signing-key
            secretNameParameter:
              runtimeValue:
                constant: cosign-signing-key
