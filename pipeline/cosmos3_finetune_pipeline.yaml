# PIPELINE DEFINITION
# Name: cosmos3-edge-finetune
# Description: Phase 4 training pipeline: ingest curated episodes -> LoRA fine-tune Cosmos3-Edge -> Gate 1 eval -> package modelcar -> cosign sign -> open promotion PR
# Inputs:
#    github_repo: str [Default: 'jeremyary/thor-testing']
#    image_name: str [Default: 'thor-builds/cosmos3-edge-modelcar']
#    learning_rate: float [Default: 0.0001]
#    lora_rank: int [Default: 16.0]
#    max_steps: int [Default: 50.0]
#    model_id: str [Default: 'nvidia/Cosmos3-Edge']
#    model_version: str [Default: 'cosmos3-edge-v2']
#    registry: str [Default: 'default-route-openshift-image-registry.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com']
#    s3_access_key: str [Default: 'admin']
#    s3_bucket: str [Default: 'episodes-curated']
#    s3_endpoint: str [Default: 'http://minio.robotics-data.svc:9000']
#    s3_secret_key: str [Default: 'robotics-demo-2026']
#    threshold_loss: float [Default: 999.0]
#    threshold_pass: float [Default: 0.0]
components:
  comp-evaluate:
    executorLabel: exec-evaluate
    inputDefinitions:
      artifacts:
        checkpoint:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        episodes:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        threshold_loss:
          defaultValue: 0.5
          isOptional: true
          parameterType: NUMBER_DOUBLE
        threshold_pass:
          defaultValue: 0.7
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        report_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
  comp-finetune-cosmos3:
    executorLabel: exec-finetune-cosmos3
    inputDefinitions:
      artifacts:
        episodes:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        batch_size:
          defaultValue: 4.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        hf_cache_path:
          defaultValue: /mnt/hf-cache
          isOptional: true
          parameterType: STRING
        learning_rate:
          defaultValue: 0.0001
          isOptional: true
          parameterType: NUMBER_DOUBLE
        lora_rank:
          defaultValue: 16.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        max_steps:
          defaultValue: 5000.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        model_id:
          defaultValue: nvidia/Cosmos3-Edge
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        checkpoint_out:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
  comp-ingest-episodes:
    executorLabel: exec-ingest-episodes
    inputDefinitions:
      parameters:
        s3_access_key:
          parameterType: STRING
        s3_bucket:
          parameterType: STRING
        s3_endpoint:
          parameterType: STRING
        s3_secret_key:
          parameterType: STRING
        train_split:
          defaultValue: 0.8
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        episodes_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: NUMBER_INTEGER
  comp-open-promotion-pr:
    executorLabel: exec-open-promotion-pr
    inputDefinitions:
      artifacts:
        eval_report:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        image_ref_artifact:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        github_repo:
          defaultValue: jeremyary/thor-testing
          isOptional: true
          parameterType: STRING
        github_token_path:
          defaultValue: /etc/github/token
          isOptional: true
          parameterType: STRING
        gitops_green_file:
          defaultValue: gitops/vllm-cosmos3/deployment-green.yaml
          isOptional: true
          parameterType: STRING
        model_version:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-package-modelcar:
    executorLabel: exec-package-modelcar
    inputDefinitions:
      artifacts:
        checkpoint:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        eval_report:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        image_name:
          parameterType: STRING
        model_version:
          parameterType: STRING
        registry:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        image_ref_out:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
  comp-sign-modelcar:
    executorLabel: exec-sign-modelcar
    inputDefinitions:
      artifacts:
        image_ref_artifact:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        cosign_key_path:
          defaultValue: /etc/cosign/cosign.key
          isOptional: true
          parameterType: STRING
        rekor_url:
          defaultValue: https://rekor-server-trusted-artifact-signer.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-evaluate:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3==1.35.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate(\n    checkpoint:      dsl.Input[dsl.Model],\n    episodes:\
          \        dsl.Input[dsl.Dataset],\n    threshold_loss:  float = 0.5,\n  \
          \  threshold_pass:  float = 0.7,   # minimum fraction of val episodes within\
          \ budget\n    report_out:      dsl.Output[dsl.Dataset] = None,\n) -> str:\n\
          \    \"\"\"Gate 1 evaluation.  Fails the pipeline step (sys.exit 1) if thresholds\n\
          \    are not met so the downstream modelcar + sign + promote steps are skipped.\"\
          \"\"\n    import json, pathlib, sys\n\n    checkpoint_dir = pathlib.Path(checkpoint.path)\n\
          \    val_dir        = pathlib.Path(episodes.path) / \"val\"\n    out   \
          \         = pathlib.Path(report_out.path)\n    out.mkdir(parents=True, exist_ok=True)\n\
          \n    meta = json.loads((checkpoint_dir / \"training_meta.json\").read_text())\n\
          \    final_loss = meta.get(\"final_loss\", 999)\n\n    # Score val episodes\
          \ using the within_budget signal as a proxy for model quality\n    val_eps\
          \ = list(val_dir.glob(\"*.json\"))\n    within_budget_count = sum(\n   \
          \     1 for ep_file in val_eps\n        if json.loads(ep_file.read_text()).get(\"\
          all_within_budget\", False)\n    )\n    pass_rate = within_budget_count\
          \ / max(len(val_eps), 1)\n\n    report = {\n        \"final_loss\":    \
          \    final_loss,\n        \"pass_rate\":         round(pass_rate, 4),\n\
          \        \"val_episodes\":      len(val_eps),\n        \"threshold_loss\"\
          :    threshold_loss,\n        \"threshold_pass\":    threshold_pass,\n \
          \       \"loss_ok\":           final_loss <= threshold_loss,\n        \"\
          pass_rate_ok\":      pass_rate  >= threshold_pass,\n        \"gate1_pass\"\
          :        final_loss <= threshold_loss and pass_rate >= threshold_pass,\n\
          \    }\n    (out / \"eval_report.json\").write_text(json.dumps(report, indent=2))\n\
          \    print(f\"[evaluate] Gate 1: loss={final_loss:.4f} (<={threshold_loss}?{report['loss_ok']})\
          \ \"\n          f\"pass_rate={pass_rate:.2%} (>={threshold_pass:.0%}?{report['pass_rate_ok']})\"\
          )\n\n    if not report[\"gate1_pass\"]:\n        print(\"[evaluate] FAIL\
          \ -- Gate 1 thresholds not met, pipeline aborted\")\n        sys.exit(1)\n\
          \n    verdict = \"PASS\"\n    print(f\"[evaluate] Gate 1 PASS\")\n    return\
          \ verdict\n\n"
        image: python:3.12-slim
    exec-finetune-cosmos3:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - finetune_cosmos3
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef finetune_cosmos3(\n    episodes:           dsl.Input[dsl.Dataset],\n\
          \    model_id:           str   = \"nvidia/Cosmos3-Edge\",\n    max_steps:\
          \          int   = 5000,\n    learning_rate:      float = 1e-4,\n    lora_rank:\
          \          int   = 16,\n    batch_size:         int   = 4,\n    hf_cache_path:\
          \      str   = \"/mnt/hf-cache\",\n    checkpoint_out:     dsl.Output[dsl.Model]\
          \ = None,\n) -> float:\n    \"\"\"LoRA fine-tune Cosmos3-Edge 4B.\n\n  \
          \  For the demo, set max_steps=50 to get a quick run that proves the pipeline\n\
          \    works end-to-end on GPU.  The eval gate will use a lenient threshold\n\
          \    (--threshold-loss 999) so the 50-step checkpoint always passes Gate\
          \ 1.\n\n    For a real run, max_steps=5000 with the default threshold_loss=0.5\
          \ in the\n    evaluate step.\n    \"\"\"\n    import subprocess, pathlib,\
          \ json, sys, os\n\n    train_dir = pathlib.Path(episodes.path) / \"train\"\
          \n    out_dir   = pathlib.Path(checkpoint_out.path)\n    out_dir.mkdir(parents=True,\
          \ exist_ok=True)\n\n    episode_files = list(train_dir.glob(\"*.json\"))\n\
          \    print(f\"[finetune] {len(episode_files)} training episodes, max_steps={max_steps}\"\
          )\n\n    # Build a minimal NeMo/huggingface dataset from episode JSON files\n\
          \    texts = []\n    for ep_file in episode_files[:500]:  # cap at 500 episodes\
          \ per run\n        ep = json.loads(ep_file.read_text())\n        for tick\
          \ in ep.get(\"tick_data\", []):\n            scene  = tick.get(\"scene\"\
          , \"\")\n            result = tick.get(\"action_result\", {}).get(\"raw_response\"\
          , \"\")\n            if scene and result:\n                texts.append({\"\
          scene\": scene, \"action\": result})\n\n    dataset_file = out_dir / \"\
          train_dataset.jsonl\"\n    with open(dataset_file, \"w\") as f:\n      \
          \  for item in texts:\n            f.write(json.dumps(item) + \"\\n\")\n\
          \    print(f\"[finetune] wrote {len(texts)} training examples -> {dataset_file}\"\
          )\n\n    # -----------------------------------------------------------------------\n\
          \    # TRAINING INVOCATION\n    # Uncomment and configure the appropriate\
          \ training command for the\n    # target training framework once the training\
          \ image is finalised.\n    # -----------------------------------------------------------------------\n\
          \    # Option A -- NeMo fine-tune with Cosmos recipe:\n    # cmd = [\n \
          \   #     \"python3\", \"-m\", \"cosmos_reason1.finetune\",\n    #     \"\
          --model-id\", model_id,\n    #     \"--train-data\", str(dataset_file),\n\
          \    #     \"--output-dir\", str(out_dir),\n    #     \"--max-steps\", str(max_steps),\n\
          \    #     \"--learning-rate\", str(learning_rate),\n    #     \"--lora-rank\"\
          , str(lora_rank),\n    #     \"--batch-size\", str(batch_size),\n    # \
          \    \"--hf-cache\", hf_cache_path,\n    # ]\n    # subprocess.run(cmd,\
          \ check=True)\n    #\n    # Option B -- HuggingFace PEFT LoRA (lightweight\
          \ alternative):\n    # subprocess.run([\n    #     \"python3\", str(pathlib.Path(__file__).parent\
          \ / \"train_lora.py\"),\n    #     \"--base-model\", model_id,\n    #  \
          \   \"--dataset\", str(dataset_file),\n    #     \"--output-dir\", str(out_dir),\n\
          \    #     \"--max-steps\", str(max_steps),\n    #     \"--lr\", str(learning_rate),\n\
          \    #     \"--lora-rank\", str(lora_rank),\n    # ], check=True)\n    #\
          \ -----------------------------------------------------------------------\n\
          \n    # STUB: write a metadata file that downstream steps can read.\n  \
          \  # Replace with real training above before a non-demo run.\n    final_loss\
          \ = 0.42   # placeholder -- real run reads from training log\n    meta =\
          \ {\n        \"model_id\":         model_id,\n        \"max_steps\":   \
          \     max_steps,\n        \"training_examples\":len(texts),\n        \"\
          final_loss\":       final_loss,\n        \"lora_rank\":        lora_rank,\n\
          \    }\n    (out_dir / \"training_meta.json\").write_text(json.dumps(meta,\
          \ indent=2))\n    print(f\"[finetune] done -- final_loss={final_loss}\"\
          )\n    return final_loss\n\n"
        image: nvcr.io/nvidia/nemo:24.09
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
            resourceType: nvidia.com/gpu
            type: nvidia.com/gpu
    exec-ingest-episodes:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - ingest_episodes
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3==1.35.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef ingest_episodes(\n    s3_endpoint:   str,\n    s3_bucket:   \
          \  str,\n    s3_access_key: str,\n    s3_secret_key: str,\n    train_split:\
          \   float = 0.8,\n    episodes_out:  dsl.Output[dsl.Dataset] = None,\n)\
          \ -> int:\n    \"\"\"Download curated episodes from MinIO, dedupe by episode_id,\
          \ split train/val.\"\"\"\n    import boto3, json, pathlib, hashlib, random\n\
          \n    s3 = boto3.client(\n        \"s3\",\n        endpoint_url        \
          \ = s3_endpoint,\n        aws_access_key_id    = s3_access_key,\n      \
          \  aws_secret_access_key= s3_secret_key,\n    )\n    out = pathlib.Path(episodes_out.path)\n\
          \    train_dir = out / \"train\"\n    val_dir   = out / \"val\"\n    train_dir.mkdir(parents=True,\
          \ exist_ok=True)\n    val_dir.mkdir(parents=True, exist_ok=True)\n\n   \
          \ paginator = s3.get_paginator(\"list_objects_v2\")\n    seen_ids  = set()\n\
          \    all_eps   = []\n\n    for page in paginator.paginate(Bucket=s3_bucket):\n\
          \        for obj in page.get(\"Contents\", []):\n            key = obj[\"\
          Key\"]\n            if not key.endswith(\".json\"):\n                continue\n\
          \            body = s3.get_object(Bucket=s3_bucket, Key=key)[\"Body\"].read()\n\
          \            ep   = json.loads(body)\n            eid  = ep.get(\"episode_id\"\
          , hashlib.md5(body).hexdigest()[:12])\n            if eid in seen_ids:\n\
          \                continue\n            seen_ids.add(eid)\n            all_eps.append((eid,\
          \ ep))\n\n    random.shuffle(all_eps)\n    split_idx = int(len(all_eps)\
          \ * train_split)\n    for i, (eid, ep) in enumerate(all_eps):\n        target\
          \ = train_dir if i < split_idx else val_dir\n        (target / f\"{eid}.json\"\
          ).write_text(json.dumps(ep))\n\n    print(f\"[ingest] total={len(all_eps)}\
          \ train={split_idx} val={len(all_eps)-split_idx}\")\n    return len(all_eps)\n\
          \n"
        image: python:3.12-slim
    exec-open-promotion-pr:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - open_promotion_pr
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'PyGithub==2.4.0'\
          \ && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef open_promotion_pr(\n    image_ref_artifact: dsl.Input[dsl.Artifact],\n\
          \    eval_report:        dsl.Input[dsl.Dataset],\n    model_version:   \
          \   str,\n    github_repo:        str = \"jeremyary/thor-testing\",\n  \
          \  github_token_path:  str = \"/etc/github/token\",\n    gitops_green_file:\
          \  str = \"gitops/vllm-cosmos3/deployment-green.yaml\",\n) -> str:\n   \
          \ \"\"\"Open a PR updating deployment-green.yaml's modelcar digest and MODEL_VERSION.\n\
          \n    The PR body includes the Gate 1 eval report so reviewers can assess\
          \ the\n    checkpoint quality before merging (Gate 3 -- human PR merge).\n\
          \    \"\"\"\n    import pathlib, json, base64\n    from github import Github,\
          \ GithubException\n\n    art_dir   = pathlib.Path(image_ref_artifact.path)\n\
          \    meta      = json.loads((art_dir / \"image_ref.json\").read_text())\n\
          \    image_ref = meta[\"image_ref\"]   # registry/image@sha256:...\n   \
          \ digest    = meta[\"digest\"]\n\n    eval_dir  = pathlib.Path(eval_report.path)\n\
          \    report    = json.loads((eval_dir / \"eval_report.json\").read_text())\n\
          \n    token     = pathlib.Path(github_token_path).read_text().strip()\n\
          \    g         = Github(token)\n    repo      = g.get_repo(github_repo)\n\
          \n    branch_name = f\"promote/{model_version}\"\n    base_sha    = repo.get_branch(\"\
          main\").commit.sha\n\n    # Create branch\n    try:\n        repo.create_git_ref(f\"\
          refs/heads/{branch_name}\", base_sha)\n    except GithubException as e:\n\
          \        if e.status != 422:   # 422 = branch already exists\n         \
          \   raise\n\n    # Read current deployment-green.yaml, update image digest\
          \ + MODEL_VERSION\n    file_content = repo.get_contents(gitops_green_file,\
          \ ref=branch_name)\n    current_yaml = file_content.decoded_content.decode()\n\
          \n    # Regex-replace the two fields we need to update\n    import re\n\
          \    # 1) modelcar initContainer image\n    new_yaml = re.sub(\n       \
          \ r'(image:\\s+)([^\\s]+/thor-builds/cosmos3-edge-modelcar@sha256:[a-f0-9]+)',\n\
          \        lambda m: m.group(1) + image_ref,\n        current_yaml,\n    )\n\
          \    # 2) MODEL_VERSION env var value\n    new_yaml = re.sub(\n        r'(-\
          \ name: MODEL_VERSION\\s+\\n\\s+value:\\s+\")[^\"]+(\")',\n        lambda\
          \ m: m.group(1) + model_version + m.group(2),\n        new_yaml,\n    )\n\
          \n    pr_body = f\"\"\"## Automated model promotion -- {model_version}\n\
          \n**Gate 1 eval report:**\n\n| Metric | Value | Threshold | Pass |\n|---|---|---|---|\n\
          | Final loss | `{report['final_loss']:.4f}` | `<= {report['threshold_loss']}`\
          \ | {'PASS' if report['loss_ok'] else 'FAIL'} |\n| Val pass-rate | `{report['pass_rate']:.1%}`\
          \ | `>= {report['threshold_pass']:.0%}` | {'PASS' if report['pass_rate_ok']\
          \ else 'FAIL'} |\n| Val episodes | `{report['val_episodes']}` | -- | --\
          \ |\n\n**Modelcar digest:** `{digest}`\n\n**What merging this PR does (Act\
          \ 3 demo beat):**\n1. Argo CD syncs `deployment-green.yaml` -> green pod\
          \ starts, pulls & verifies new modelcar\n2. `deployment.yaml` (blue) sets\
          \ `replicas: 0` -> blue goes dark\n3. Service selector flips to `color:\
          \ green` -> port 30800 routes to new model\n4. Re-run the Act 1 scene ->\
          \ visibly better predicted rollout in Perses (v2 panel)\n\n_Opened automatically\
          \ by the cosmos3_finetune_pipeline KFP run._\n\"\"\"\n\n    repo.update_file(\n\
          \        gitops_green_file,\n        f\"promote: cosmos3-edge {model_version}\
          \ modelcar digest\",\n        new_yaml,\n        file_content.sha,\n   \
          \     branch=branch_name,\n    )\n    pr = repo.create_pull(\n        title=f\"\
          [promote] cosmos3-edge {model_version}\",\n        body=pr_body,\n     \
          \   head=branch_name,\n        base=\"main\",\n    )\n    print(f\"[promote]\
          \ PR opened: {pr.html_url}\")\n    return pr.html_url\n\n"
        image: bitnami/git:latest
    exec-package-modelcar:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - package_modelcar
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef package_modelcar(\n    checkpoint:    dsl.Input[dsl.Model],\n\
          \    eval_report:   dsl.Input[dsl.Dataset],\n    registry:      str,\n \
          \   image_name:    str,\n    model_version: str,\n    image_ref_out: dsl.Output[dsl.Artifact]\
          \ = None,\n) -> str:\n    \"\"\"Package the fine-tuned checkpoint as a modelcar\
          \ OCI image (crane append).\n\n    Follows the D017 pattern (crane, not\
          \ buildah) for fast multi-GB pushes.\n    The base is ubi9-micro; the checkpoint\
          \ layer is appended on top.\n    \"\"\"\n    import subprocess, pathlib,\
          \ json, os, tempfile\n\n    checkpoint_dir = pathlib.Path(checkpoint.path)\n\
          \    out_dir        = pathlib.Path(image_ref_out.path)\n    out_dir.mkdir(parents=True,\
          \ exist_ok=True)\n\n    image_ref = f\"{registry}/{image_name}:{model_version}\"\
          \n    print(f\"[package] building modelcar -> {image_ref}\")\n\n    # Create\
          \ a tar of the checkpoint directory to append as a layer\n    with tempfile.NamedTemporaryFile(suffix=\"\
          .tar\", delete=False) as tmp:\n        layer_tar = tmp.name\n\n    subprocess.run([\n\
          \        \"tar\", \"-cf\", layer_tar,\n        \"-C\", str(checkpoint_dir.parent),\n\
          \        checkpoint_dir.name,\n    ], check=True)\n\n    # crane append:\
          \ base=ubi9-micro, one layer = checkpoint tar\n    subprocess.run([\n  \
          \      \"crane\", \"append\",\n        \"--base\", \"registry.access.redhat.com/ubi9/ubi-micro:latest\"\
          ,\n        \"--new_layer\", layer_tar,\n        \"--new_tag\", image_ref,\n\
          \    ], check=True)\n\n    os.unlink(layer_tar)\n\n    # Resolve by digest\
          \ (per D014 convention)\n    result = subprocess.run(\n        [\"crane\"\
          , \"digest\", image_ref],\n        capture_output=True, text=True, check=True,\n\
          \    )\n    digest = result.stdout.strip()\n    image_ref_by_digest = f\"\
          {registry}/{image_name}@{digest}\"\n    print(f\"[package] pushed -> {image_ref_by_digest}\"\
          )\n\n    meta = {\"image_ref\": image_ref_by_digest, \"tag\": image_ref,\
          \ \"digest\": digest}\n    (out_dir / \"image_ref.json\").write_text(json.dumps(meta))\n\
          \    return image_ref_by_digest\n\n"
        image: gcr.io/go-containerregistry/crane:latest
    exec-sign-modelcar:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - sign_modelcar
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef sign_modelcar(\n    image_ref_artifact: dsl.Input[dsl.Artifact],\n\
          \    cosign_key_path:    str = \"/etc/cosign/cosign.key\",\n    rekor_url:\
          \          str = \"https://rekor-server-trusted-artifact-signer.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com\"\
          ,\n) -> str:\n    \"\"\"cosign sign the modelcar by digest. Uses the same\
          \ static keypair + RHTAS\n    Rekor as the Tekton OS-image pipeline (D008/D022).\"\
          \"\"\n    import subprocess, pathlib, json, os\n\n    art_dir   = pathlib.Path(image_ref_artifact.path)\n\
          \    meta      = json.loads((art_dir / \"image_ref.json\").read_text())\n\
          \    image_ref = meta[\"image_ref\"]\n\n    print(f\"[sign] cosign sign\
          \ {image_ref}\")\n    env = os.environ.copy()\n    env[\"COSIGN_PASSWORD\"\
          ] = \"\"  # key is unencrypted in the Secret (matches D008)\n    subprocess.run([\n\
          \        \"cosign\", \"sign\",\n        \"--key\",        cosign_key_path,\n\
          \        \"--rekor-url\",  rekor_url,\n        \"--tlog-upload=true\",\n\
          \        \"-y\",\n        image_ref,\n    ], check=True, env=env)\n    print(f\"\
          [sign] signed -> Rekor entry logged\")\n    return image_ref\n\n"
        image: gcr.io/projectsigstore/cosign:v2.6.5
pipelineInfo:
  description: 'Phase 4 training pipeline: ingest curated episodes -> LoRA fine-tune
    Cosmos3-Edge -> Gate 1 eval -> package modelcar -> cosign sign -> open promotion
    PR'
  name: cosmos3-edge-finetune
root:
  dag:
    tasks:
      evaluate:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate
        dependentTasks:
        - finetune-cosmos3
        - ingest-episodes
        inputs:
          artifacts:
            checkpoint:
              taskOutputArtifact:
                outputArtifactKey: checkpoint_out
                producerTask: finetune-cosmos3
            episodes:
              taskOutputArtifact:
                outputArtifactKey: episodes_out
                producerTask: ingest-episodes
          parameters:
            threshold_loss:
              componentInputParameter: threshold_loss
            threshold_pass:
              componentInputParameter: threshold_pass
        taskInfo:
          name: evaluate
      finetune-cosmos3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-finetune-cosmos3
        dependentTasks:
        - ingest-episodes
        inputs:
          artifacts:
            episodes:
              taskOutputArtifact:
                outputArtifactKey: episodes_out
                producerTask: ingest-episodes
          parameters:
            learning_rate:
              componentInputParameter: learning_rate
            lora_rank:
              componentInputParameter: lora_rank
            max_steps:
              componentInputParameter: max_steps
            model_id:
              componentInputParameter: model_id
        taskInfo:
          name: finetune-cosmos3
      ingest-episodes:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-ingest-episodes
        inputs:
          parameters:
            s3_access_key:
              componentInputParameter: s3_access_key
            s3_bucket:
              componentInputParameter: s3_bucket
            s3_endpoint:
              componentInputParameter: s3_endpoint
            s3_secret_key:
              componentInputParameter: s3_secret_key
        taskInfo:
          name: ingest-episodes
      open-promotion-pr:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-open-promotion-pr
        dependentTasks:
        - evaluate
        - package-modelcar
        inputs:
          artifacts:
            eval_report:
              taskOutputArtifact:
                outputArtifactKey: report_out
                producerTask: evaluate
            image_ref_artifact:
              taskOutputArtifact:
                outputArtifactKey: image_ref_out
                producerTask: package-modelcar
          parameters:
            github_repo:
              componentInputParameter: github_repo
            model_version:
              componentInputParameter: model_version
        taskInfo:
          name: open-promotion-pr
      package-modelcar:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-package-modelcar
        dependentTasks:
        - evaluate
        - finetune-cosmos3
        inputs:
          artifacts:
            checkpoint:
              taskOutputArtifact:
                outputArtifactKey: checkpoint_out
                producerTask: finetune-cosmos3
            eval_report:
              taskOutputArtifact:
                outputArtifactKey: report_out
                producerTask: evaluate
          parameters:
            image_name:
              componentInputParameter: image_name
            model_version:
              componentInputParameter: model_version
            registry:
              componentInputParameter: registry
        taskInfo:
          name: package-modelcar
      sign-modelcar:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-sign-modelcar
        dependentTasks:
        - package-modelcar
        inputs:
          artifacts:
            image_ref_artifact:
              taskOutputArtifact:
                outputArtifactKey: image_ref_out
                producerTask: package-modelcar
        taskInfo:
          name: sign-modelcar
  inputDefinitions:
    parameters:
      github_repo:
        defaultValue: jeremyary/thor-testing
        isOptional: true
        parameterType: STRING
      image_name:
        defaultValue: thor-builds/cosmos3-edge-modelcar
        isOptional: true
        parameterType: STRING
      learning_rate:
        defaultValue: 0.0001
        isOptional: true
        parameterType: NUMBER_DOUBLE
      lora_rank:
        defaultValue: 16.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      max_steps:
        defaultValue: 50.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      model_id:
        defaultValue: nvidia/Cosmos3-Edge
        isOptional: true
        parameterType: STRING
      model_version:
        defaultValue: cosmos3-edge-v2
        isOptional: true
        parameterType: STRING
      registry:
        defaultValue: default-route-openshift-image-registry.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com
        isOptional: true
        parameterType: STRING
      s3_access_key:
        defaultValue: admin
        isOptional: true
        parameterType: STRING
      s3_bucket:
        defaultValue: episodes-curated
        isOptional: true
        parameterType: STRING
      s3_endpoint:
        defaultValue: http://minio.robotics-data.svc:9000
        isOptional: true
        parameterType: STRING
      s3_secret_key:
        defaultValue: robotics-demo-2026
        isOptional: true
        parameterType: STRING
      threshold_loss:
        defaultValue: 999.0
        isOptional: true
        parameterType: NUMBER_DOUBLE
      threshold_pass:
        defaultValue: 0.0
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-finetune-cosmos3:
          podMetadata:
            labels:
              kueue.x-k8s.io/queue-name: robotics-train
        exec-open-promotion-pr:
          secretAsVolume:
          - mountPath: /etc/github
            optional: false
            secretName: github-token
            secretNameParameter:
              runtimeValue:
                constant: github-token
        exec-sign-modelcar:
          secretAsVolume:
          - mountPath: /etc/cosign
            optional: false
            secretName: cosign-signing-key
            secretNameParameter:
              runtimeValue:
                constant: cosign-signing-key
