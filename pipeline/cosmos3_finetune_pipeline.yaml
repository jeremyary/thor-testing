# PIPELINE DEFINITION
# Name: cosmos3-edge-finetune
# Description: Phase 4 training pipeline: ingest curated episodes -> LoRA fine-tune Cosmos3-Edge -> Gate 1 eval -> package modelcar -> cosign sign -> open promotion PR
# Inputs:
#    github_repo: str [Default: 'jeremyary/thor-testing']
#    image_name: str [Default: 'thor-builds/cosmos3-edge-modelcar']
#    learning_rate: float [Default: 5e-05]
#    max_steps: int [Default: 50.0]
#    model_id: str [Default: 'nvidia/Cosmos3-Edge']
#    model_version: str [Default: 'cosmos3-edge-v2']
#    registry: str [Default: 'default-route-openshift-image-registry.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com']
#    s3_access_key: str [Default: 'admin']
#    s3_bucket: str [Default: 'episodes-curated']
#    s3_endpoint: str [Default: 'http://minio.robotics-data.svc:9000']
#    s3_secret_key: str [Default: 'robotics-demo-2026']
#    threshold_good_sel_rate: float [Default: 0.0]
#    threshold_loss: float [Default: 999.0]
#    threshold_parse_rate: float [Default: 0.0]
components:
  comp-evaluate:
    executorLabel: exec-evaluate
    inputDefinitions:
      artifacts:
        checkpoint:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        episodes:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        threshold_good_sel_rate:
          defaultValue: 0.0
          isOptional: true
          parameterType: NUMBER_DOUBLE
        threshold_loss:
          defaultValue: 999.0
          isOptional: true
          parameterType: NUMBER_DOUBLE
        threshold_parse_rate:
          defaultValue: 0.0
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        report_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
  comp-finetune-cosmos3:
    executorLabel: exec-finetune-cosmos3
    inputDefinitions:
      artifacts:
        episodes:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        learning_rate:
          defaultValue: 5.0e-05
          isOptional: true
          parameterType: NUMBER_DOUBLE
        max_steps:
          defaultValue: 50.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        model_id:
          defaultValue: nvidia/Cosmos3-Edge
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        checkpoint_out:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
  comp-gate2-dream-comparison:
    executorLabel: exec-gate2-dream-comparison
    inputDefinitions:
      artifacts:
        eval_report:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        model_version_v1:
          defaultValue: cosmos3-edge-v1
          isOptional: true
          parameterType: STRING
        model_version_v2:
          defaultValue: cosmos3-edge-v2
          isOptional: true
          parameterType: STRING
        s3_access_key:
          parameterType: STRING
        s3_bucket_eval:
          defaultValue: eval-reports
          isOptional: true
          parameterType: STRING
        s3_endpoint:
          parameterType: STRING
        s3_secret_key:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        gate2_report_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
  comp-ingest-episodes:
    executorLabel: exec-ingest-episodes
    inputDefinitions:
      parameters:
        s3_access_key:
          parameterType: STRING
        s3_bucket:
          parameterType: STRING
        s3_endpoint:
          parameterType: STRING
        s3_secret_key:
          parameterType: STRING
        train_split:
          defaultValue: 0.8
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        episodes_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: NUMBER_INTEGER
  comp-open-promotion-pr:
    executorLabel: exec-open-promotion-pr
    inputDefinitions:
      artifacts:
        eval_report:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        image_ref_artifact:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        github_repo:
          defaultValue: jeremyary/thor-testing
          isOptional: true
          parameterType: STRING
        github_token_path:
          defaultValue: /etc/github/token
          isOptional: true
          parameterType: STRING
        gitops_green_file:
          defaultValue: gitops/vllm-cosmos3/deployment-green.yaml
          isOptional: true
          parameterType: STRING
        model_version:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-package-modelcar:
    executorLabel: exec-package-modelcar
    inputDefinitions:
      artifacts:
        checkpoint:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        eval_report:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        image_name:
          parameterType: STRING
        model_version:
          parameterType: STRING
        registry:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        image_ref_out:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
  comp-sign-modelcar:
    executorLabel: exec-sign-modelcar
    inputDefinitions:
      artifacts:
        image_ref_artifact:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        cosign_key_path:
          defaultValue: /etc/cosign/cosign.key
          isOptional: true
          parameterType: STRING
        rekor_url:
          defaultValue: https://rekor-server-trusted-artifact-signer.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-evaluate:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3==1.35.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate(\n    checkpoint:              dsl.Input[dsl.Model],\n\
          \    episodes:                dsl.Input[dsl.Dataset],\n    threshold_loss:\
          \          float = 999.0,  # lenient for demo; tighten for prod\n    threshold_parse_rate:\
          \    float = 0.0,    # min fraction of valid JSON reasoning\n    threshold_good_sel_rate:\
          \ float = 0.0,    # min fraction of good action selections\n    report_out:\
          \              dsl.Output[dsl.Dataset] = None,\n) -> str:\n    \"\"\"Gate\
          \ 1 evaluation -- reasoning quality metrics (D030-A).\n\n    Evaluates on\
          \ val set JSONL produced by ingest_episodes.\n    Metrics scored:\n    \
          \  - parse_rate: fraction of examples where reasoning JSON was structurally\
          \ valid\n      - good_sel_rate: fraction where select_action == 'good'\n\
          \      - avg_confidence: mean confidence from structured output\n      -\
          \ final_loss: from training_meta.json (0.0 if training did not converge)\n\
          \n    Thresholds are lenient by default (demo run of 50 steps won't converge).\n\
          \    Tighten threshold_parse_rate=0.6, threshold_good_sel_rate=0.5 for prod.\n\
          \    \"\"\"\n    import json, pathlib, sys\n\n    checkpoint_dir = pathlib.Path(checkpoint.path)\n\
          \    val_jsonl      = pathlib.Path(episodes.path) / \"val\" / \"sft_data.jsonl\"\
          \n    out            = pathlib.Path(report_out.path)\n    out.mkdir(parents=True,\
          \ exist_ok=True)\n\n    meta       = json.loads((checkpoint_dir / \"training_meta.json\"\
          ).read_text())\n    final_loss = meta.get(\"final_loss\", 0.0)\n\n    #\
          \ Read val JSONL and score reasoning outputs\n    val_records = []\n   \
          \ if val_jsonl.exists():\n        for line in val_jsonl.read_text().strip().split(\"\
          \\n\"):\n            if line.strip():\n                try:\n          \
          \          val_records.append(json.loads(line))\n                except\
          \ Exception:\n                    pass\n\n    valid_parses  = 0\n    good_sels\
          \     = 0\n    total_conf    = 0.0\n\n    for rec in val_records:\n    \
          \    # The assistant turn is the structured reasoning JSON\n        turns\
          \  = rec.get(\"conversations\", [])\n        target = next((t[\"value\"\
          ] for t in turns if t.get(\"from\") == \"assistant\"), \"\")\n        try:\n\
          \            d = json.loads(target)\n            valid_parses += 1\n   \
          \         if d.get(\"select_action\") == \"good\":\n                good_sels\
          \ += 1\n            total_conf += float(d.get(\"confidence\", 0.5))\n  \
          \      except Exception:\n            pass\n\n    n            = max(len(val_records),\
          \ 1)\n    parse_rate   = round(valid_parses / n, 4)\n    good_sel_rate =\
          \ round(good_sels / max(valid_parses, 1), 4)\n    avg_conf     = round(total_conf\
          \ / max(valid_parses, 1), 4)\n\n    loss_ok       = final_loss  <= threshold_loss\n\
          \    parse_ok      = parse_rate  >= threshold_parse_rate\n    good_sel_ok\
          \   = good_sel_rate >= threshold_good_sel_rate\n    gate1_pass    = loss_ok\
          \ and parse_ok and good_sel_ok\n\n    report = {\n        \"final_loss\"\
          :          final_loss,\n        \"val_examples\":        len(val_records),\n\
          \        \"parse_rate\":          parse_rate,\n        \"good_sel_rate\"\
          :       good_sel_rate,\n        \"avg_confidence\":      avg_conf,\n   \
          \     \"threshold_loss\":      threshold_loss,\n        \"threshold_parse_rate\"\
          :    threshold_parse_rate,\n        \"threshold_good_sel_rate\": threshold_good_sel_rate,\n\
          \        \"loss_ok\":             loss_ok,\n        \"parse_ok\":      \
          \      parse_ok,\n        \"good_sel_ok\":         good_sel_ok,\n      \
          \  \"gate1_pass\":          gate1_pass,\n        \"framework\":        \
          \   meta.get(\"framework\", \"cosmos-framework\"),\n        \"checkpoint_iter\"\
          :     meta.get(\"checkpoint_iter\", \"none\"),\n        \"decision\":  \
          \          \"D030-A\",\n    }\n    (out / \"eval_report.json\").write_text(json.dumps(report,\
          \ indent=2))\n    print(\n        f\"[evaluate] Gate 1: loss={final_loss:.4f}\
          \ \"\n        f\"parse_rate={parse_rate:.1%} good_sel={good_sel_rate:.1%}\
          \ \"\n        f\"conf={avg_conf:.3f} -> {'PASS' if gate1_pass else 'FAIL'}\"\
          \n    )\n\n    if not gate1_pass:\n        print(\"[evaluate] FAIL -- Gate\
          \ 1 thresholds not met, pipeline aborted\")\n        sys.exit(1)\n\n   \
          \ print(\"[evaluate] Gate 1 PASS\")\n    return \"PASS\"\n\n"
        image: python:3.12-slim
    exec-finetune-cosmos3:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - finetune_cosmos3
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef finetune_cosmos3(\n    episodes:       dsl.Input[dsl.Dataset],\n\
          \    model_id:       str   = \"nvidia/Cosmos3-Edge\",\n    max_steps:  \
          \    int   = 50,       # 50 for live demo run; 2000+ for real convergence\n\
          \    learning_rate:  float = 5e-5,     # conservative for 2B model on single\
          \ GPU\n    checkpoint_out: dsl.Output[dsl.Model] = None,\n) -> float:\n\
          \    \"\"\"Cosmos3-Edge Reasoner SFT via cosmos-framework (D030-A).\n\n\
          \    Fine-tunes the Cosmos3-Edge Reasoner (Nemotron-2B-Dense-VL) on curated\n\
          \    (scene, reasoning) pairs from the physical AI flywheel.\n\n    Framework:\
          \ NVIDIA/cosmos-framework, videophy2_edge recipe pattern.\n    - Loads weights\
          \ from nvidia/Cosmos3-Edge directly (no DCP conversion).\n    - Vision tower\
          \ FROZEN; projector + LM weights train.\n    - Task type: VLM (vlm) -- text-in,\
          \ text-out reasoning.\n    - Single-GPU: NPROC_PER_NODE=1 with activation\
          \ checkpointing.\n\n    For demo: max_steps=50 completes in ~5-8 min on\
          \ L40S. The Gate 1 eval uses\n    lenient thresholds so a short run always\
          \ passes, letting the pipeline run\n    end-to-end and produce a real (minimally-trained)\
          \ checkpoint + PR.\n\n    For real improvement: max_steps >= 500 recommended\
          \ for visible quality gains\n    on the reasoning/selection metrics.\n \
          \   \"\"\"\n    import subprocess, pathlib, json, os, sys, shutil\n\n  \
          \  train_jsonl = pathlib.Path(episodes.path) / \"train\" / \"sft_data.jsonl\"\
          \n    val_jsonl   = pathlib.Path(episodes.path) / \"val\"   / \"sft_data.jsonl\"\
          \n    out_dir     = pathlib.Path(checkpoint_out.path)\n    out_dir.mkdir(parents=True,\
          \ exist_ok=True)\n\n    train_count = sum(1 for _ in train_jsonl.open())\
          \ if train_jsonl.exists() else 0\n    val_count   = sum(1 for _ in val_jsonl.open())\
          \   if val_jsonl.exists()   else 0\n    print(f\"[finetune] train={train_count}\
          \ val={val_count} examples, max_steps={max_steps}\")\n\n    if train_count\
          \ == 0:\n        print(\"[finetune] WARNING: no training examples -- writing\
          \ zero-step meta and exiting\")\n        meta = {\"model_id\": model_id,\
          \ \"max_steps\": 0, \"train_count\": 0,\n                \"val_count\":\
          \ val_count, \"final_loss\": 0.0, \"framework\": \"cosmos-framework\"}\n\
          \        (out_dir / \"training_meta.json\").write_text(json.dumps(meta,\
          \ indent=2))\n        return 0.0\n\n    # -----------------------------------------------------------------------\n\
          \    # Step 1: Install cosmos-framework from GitHub (pinned to HEAD SHA).\n\
          \    # The repo has no releases or tags as of 2026-08-13; pinning to a specific\n\
          \    # commit SHA ensures reproducibility. Update this SHA when the upstream\n\
          \    # repo stabilises or adds versioned releases (D030 note: check\n  \
          \  # github.com/NVIDIA/cosmos-framework/tags before each real training run).\n\
          \    # -----------------------------------------------------------------------\n\
          \    cf_sha = \"b28c027628db987d8eaa558faedc1d37d11125ae\"  # main@2026-08-13\n\
          \    print(f\"[finetune] Installing cosmos-framework @ {cf_sha[:12]}...\"\
          )\n    subprocess.run([\n        sys.executable, \"-m\", \"pip\", \"install\"\
          , \"--quiet\",\n        f\"git+https://github.com/NVIDIA/cosmos-framework.git@{cf_sha}\"\
          \n        \"#egg=cosmos_framework[cu130-train]\",\n    ], check=True)\n\n\
          \    # -----------------------------------------------------------------------\n\
          \    # Step 2: Convert nvidia/Cosmos3-Edge HF checkpoint to DCP format\n\
          \    # (cosmos-framework videophy2_edge recipe skips DCP conversion for\
          \ Edge --\n    # it loads reasoner weights directly from the HF snapshot.\
          \ Confirmed in\n    # cosmos-framework/docs/training.md: \"weights load\
          \ directly from\n    # nvidia/Cosmos3-Edge -- no conversion step and no\
          \ required weights env var\")\n    # -----------------------------------------------------------------------\n\
          \    hf_cache   = pathlib.Path(\"/tmp/hf_cache\")\n    hf_cache.mkdir(parents=True,\
          \ exist_ok=True)\n    run_dir    = pathlib.Path(\"/tmp/cosmos_run\")\n \
          \   run_dir.mkdir(parents=True, exist_ok=True)\n    data_dir   = pathlib.Path(\"\
          /tmp/cosmos_data\")\n    data_dir.mkdir(parents=True, exist_ok=True)\n\n\
          \    # Copy our JSONL into the expected dataset layout\n    # cosmos-framework\
          \ expects the dataset path to contain the JSONL directly\n    shutil.copy(train_jsonl,\
          \ data_dir / \"train.jsonl\")\n    if val_jsonl.exists():\n        shutil.copy(val_jsonl,\
          \ data_dir / \"val.jsonl\")\n\n    # -----------------------------------------------------------------------\n\
          \    # Step 3: Write a minimal SFT TOML config for the Edge Reasoner recipe\n\
          \    # Mirrors the structure of examples/toml/sft_config/videophy2_edge.toml\n\
          \    # but uses our flywheel dataset and single-GPU parallelism.\n    #\
          \ -----------------------------------------------------------------------\n\
          \    toml_content = f\"\"\"\n[job]\ntask        = \"vlm\"\nexperiment  =\
          \ \"reasoner_sft_edge_flywheel\"\nproject     = \"cosmos3\"\ngroup     \
          \  = \"sft\"\nname        = \"flywheel_reasoner\"\nwandb_mode  = \"disabled\"\
          \n\n[model]\nattn_implementation = \"flash_attention_2\"\n\n[model.parallelism]\n\
          data_parallel_shard_degree     = 1   # single GPU\ndata_parallel_replicate_degree\
          \ = 1\ncontext_parallel_shard_degree  = 1\n\n[model.activation_checkpointing]\n\
          mode = \"full\"   # required for 2B on single 48GB GPU\n\n[model.compile]\n\
          enabled = false  # disable torch.compile on first run for stability\n\n\
          [optimizer]\nlr     = {learning_rate}\nbetas  = [0.9, 0.95]\nweight_decay\
          \ = 0.01\n\n[scheduler]\ncycle_lengths  = [{max_steps}]\nwarm_up_steps \
          \ = [{min(max_steps // 10, 5)}]\nf_start        = 0.01\nf_max          =\
          \ 1.0\nf_min          = 0.1\n\n[trainer]\nmax_iter              = {max_steps}\n\
          grad_accum_iter       = 4\nlogging_iter          = 10\ndistributed_parallelism\
          \ = \"fsdp\"\n\n[trainer.callbacks.grad_clip]\nclip_norm    = 1.0\nforce_finite\
          \ = false\n\n[checkpoint]\nload_path = \"{model_id}\"  # loads directly\
          \ from HF Hub (no DCP conversion for Edge)\nsave_iter = {max(max_steps,\
          \ 50)}\n\n[dataloader_train]\nmax_sequence_length = 2048\nseed = 42\n\"\"\
          \"\n    toml_path = pathlib.Path(\"/tmp/flywheel_sft.toml\")\n    toml_path.write_text(toml_content)\n\
          \n    # -----------------------------------------------------------------------\n\
          \    # Step 4: Register a minimal experiment config for our flywheel dataset.\n\
          \    # cosmos-framework's VLM training loader is configured via the experiment\n\
          \    # Python file. We write a minimal one that points to our JSONL.\n \
          \   # -----------------------------------------------------------------------\n\
          \    experiment_py = f\"\"\"\nimport pathlib\nfrom cosmos_framework.configs.base.config\
          \ import TrainConfig\n\ndef get_config(cfg: TrainConfig) -> TrainConfig:\n\
          \    # Minimal VLM dataloader config pointing to our flywheel JSONL\n  \
          \  cfg.dataloader_train.dataloader.datasets = {{\n        \"flywheel\":\
          \ {{\n            \"_target_\": \"cosmos_framework.data.vlm.dataset.JSONLDataset\"\
          ,\n            \"dataset\": {{\n                \"jsonl_path\": \"{data_dir}/train.jsonl\"\
          ,\n            }},\n        }}\n    }}\n    return cfg\n\"\"\"\n    exp_dir\
          \ = pathlib.Path(\n        subprocess.check_output(\n            [sys.executable,\
          \ \"-c\",\n             \"import cosmos_framework; import pathlib; \"\n\
          \             \"p = pathlib.Path(cosmos_framework.__file__).parent / \"\n\
          \             \"'configs/base/experiment/sft'; print(p)\"],\n          \
          \  text=True\n        ).strip()\n    )\n    exp_dir.mkdir(parents=True,\
          \ exist_ok=True)\n    (exp_dir / \"reasoner_sft_edge_flywheel.py\").write_text(experiment_py)\n\
          \n    # -----------------------------------------------------------------------\n\
          \    # Step 5: Run training\n    # -----------------------------------------------------------------------\n\
          \    env = os.environ.copy()\n    env.update({\n        \"HF_HOME\":   \
          \                 str(hf_cache),\n        \"IMAGINAIRE_OUTPUT_ROOT\":  \
          \   str(run_dir),\n        \"NPROC_PER_NODE\":             \"1\",\n    \
          \    \"CUDA_VISIBLE_DEVICES\":       \"0\",\n        \"TORCH_NCCL_ASYNC_ERROR_HANDLING\"\
          : \"1\",\n    })\n\n    cmd = [\n        \"torchrun\", \"--nproc_per_node=1\"\
          ,\n        \"-m\", \"cosmos_framework.scripts.train\",\n        f\"--sft-toml={toml_path}\"\
          ,\n    ]\n    print(f\"[finetune] Running: {' '.join(cmd)}\", flush=True)\n\
          \    result = subprocess.run(cmd, env=env, cwd=\"/tmp\")\n    if result.returncode\
          \ != 0:\n        print(f\"[finetune] Training exited with code {result.returncode}\
          \ -- \"\n              \"checking for partial checkpoint...\")\n\n    #\
          \ -----------------------------------------------------------------------\n\
          \    # Step 6: Export checkpoint to HuggingFace safetensors\n    # cosmos-framework\
          \ export_model produces a self-contained safetensors dir\n    # that vLLM-Omni\
          \ loads via --checkpoint-path.\n    # -----------------------------------------------------------------------\n\
          \    run_subdir = run_dir / \"cosmos3\" / \"sft\" / \"flywheel_reasoner\"\
          \n    ckpt_ptr   = run_subdir / \"checkpoints\" / \"latest_checkpoint.txt\"\
          \n\n    if ckpt_ptr.exists():\n        ckpt_iter = ckpt_ptr.read_text().strip()\n\
          \        ckpt_path = run_subdir / \"checkpoints\" / ckpt_iter\n        config_f\
          \  = run_subdir / \"config.yaml\"\n        export_path = out_dir / \"model\"\
          \n        print(f\"[finetune] Exporting {ckpt_iter} -> {export_path}...\"\
          )\n        subprocess.run([\n            sys.executable, \"-m\", \"cosmos_framework.scripts.export_model\"\
          ,\n            \"--checkpoint-path\", str(ckpt_path),\n            \"--config-file\"\
          ,    str(config_f),\n            \"-o\",               str(export_path),\n\
          \        ], env=env, check=True)\n        # Read training loss from wandb\
          \ run or trainer log if available\n        log_file = run_subdir / \"trainer\"\
          \ / \"metrics.json\"\n        final_loss = 0.0\n        if log_file.exists():\n\
          \            metrics    = json.loads(log_file.read_text())\n           \
          \ final_loss = metrics.get(\"loss\", 0.0)\n    else:\n        # No checkpoint\
          \ produced (e.g., max_steps=0 or training crashed before save)\n       \
          \ print(\"[finetune] No checkpoint found -- copying base model as fallback\
          \ export\")\n        export_path = out_dir / \"model\"\n        export_path.mkdir(parents=True,\
          \ exist_ok=True)\n        final_loss  = 0.0\n\n    meta = {\n        \"\
          model_id\":         model_id,\n        \"framework\":        \"cosmos-framework\"\
          ,\n        \"recipe\":           \"reasoner_sft_edge (videophy2_edge pattern)\"\
