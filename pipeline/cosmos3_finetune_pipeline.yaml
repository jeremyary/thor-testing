          \ else \"none\",\n        \"export_path\":      str(export_path),\n    \
          \    \"decision\":         \"D030-A\",\n    }\n    (out_dir / \"training_meta.json\"\
          ).write_text(json.dumps(meta, indent=2))\n    print(f\"[finetune] done --\
          \ loss={final_loss:.4f} export={export_path}\")\n    return float(final_loss)\n\
          \n"
