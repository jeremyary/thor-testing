          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef ingest_episodes(\n    dataset_pvc_path: str = \"/dataset/BridgeData2-Subset-Synthetic-Captions\"\
          ,\n    episodes_out:     dsl.Output[dsl.Dataset] = None,\n) -> int:\n  \
          \  \"\"\"Locate the pre-staged BridgeData2 Vision SFT dataset on a PVC (D032-D).\n\
          \n    The dataset (nvidia/BridgeData2-Subset-Synthetic-Captions) is pre-downloaded\n\
          \    to a PVC named 'bridgedata2-dataset' to avoid HuggingFace rate limits\
          \ during\n    pipeline runs (4077 small files hit the 5000-req/5min quota).\n\
          \n    cosmos-framework Vision SFT expects:\n      sft_dataset_bridge/train/video_dataset_file.jsonl\n\
          \      sft_dataset_bridge/train/videos/*.mp4\n    \"\"\"\n    import pathlib,\
          \ shutil\n\n    src = pathlib.Path(dataset_pvc_path)\n    out = pathlib.Path(episodes_out.path)\n\
          \n    # Find the JSONL in the pre-staged data\n    jsonl_candidates = list(src.rglob(\"\
          video_dataset_file.jsonl\"))\n    if not jsonl_candidates:\n        raise\
          \ FileNotFoundError(\n            f\"Dataset not found at {src}. Pre-stage\
          \ it with:\\n\"\n            f\"  huggingface_hub.snapshot_download('nvidia/BridgeData2-Subset-Synthetic-Captions',\
          \ \"\n            f\"local_dir='{src}')\"\n        )\n\n    # The output\
          \ artifact needs to contain the dataset path.\n    # Symlink the PVC data\
          \ into the output artifact directory so downstream\n    # steps can find\
          \ it without copying multi-GB of data.\n    sft_dir = None\n    for candidate\
          \ in jsonl_candidates:\n        # train/video_dataset_file.jsonl -> parent\
          \ is train/, grandparent is sft_dataset_bridge/\n        sft_dir = candidate.parent.parent\n\
          \        break\n\n    # Write a marker so finetune step knows where to find\
          \ the data\n    out.mkdir(parents=True, exist_ok=True)\n    (out / \"dataset_path.txt\"\
          ).write_text(str(sft_dir))\n\n    line_count = sum(1 for _ in jsonl_candidates[0].open())\n\
          \    videos_dir = jsonl_candidates[0].parent / \"videos\"\n    video_count\
          \ = len(list(videos_dir.glob(\"*.mp4\"))) if videos_dir.exists() else 0\n\
          \    print(f\"[ingest] pre-staged dataset found at {sft_dir}\")\n    print(f\"\
          [ingest] {line_count} clips, {video_count} videos\")\n    return line_count\n\
          \n"
        image: python:3.12-slim
    exec-open-promotion-pr:
