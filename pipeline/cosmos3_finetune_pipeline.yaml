          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'PyGithub==2.4.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef open_promotion_pr(\n    image_ref_artifact: dsl.Input[dsl.Artifact],\n\
          \    eval_report:        dsl.Input[dsl.Dataset],   # gate2_report (contains\
          \ gate1 + gate2)\n    model_version:      str,\n    github_repo:       \
          \ str = \"jeremyary/thor-testing\",\n    github_token_path:  str = \"/etc/github/token\"\
          ,\n    gitops_green_file:  str = \"gitops/vllm-cosmos3/deployment-green.yaml\"\
          ,\n) -> str:\n    \"\"\"Open a PR updating deployment-green.yaml's modelcar\
          \ digest and MODEL_VERSION.\n\n    PR body surfaces Gate 1 (reasoning quality)\
          \ + Gate 2 (dream comparison URIs)\n    so reviewers see the full flywheel\
          \ evidence before merging (Gate 3 -- human merge).\n    \"\"\"\n    import\
          \ pathlib, json, base64\n    from github import Github, GithubException\n\
          \n    art_dir   = pathlib.Path(image_ref_artifact.path)\n    meta      =\
          \ json.loads((art_dir / \"image_ref.json\").read_text())\n    image_ref\
          \ = meta[\"image_ref\"]\n    digest    = meta[\"digest\"]\n\n    # eval_report\
          \ is actually the gate2_report which embeds gate1 fields too\n    eval_dir\
          \  = pathlib.Path(eval_report.path)\n    report    = json.loads((eval_dir\
          \ / \"gate2_report.json\").read_text())\n\n    token     = pathlib.Path(github_token_path).read_text().strip()\n\
          \    g         = Github(token)\n    repo      = g.get_repo(github_repo)\n\
          \n    branch_name = f\"promote/{model_version}\"\n    base_sha    = repo.get_branch(\"\
          main\").commit.sha\n\n    # Create branch\n    try:\n        repo.create_git_ref(f\"\
          refs/heads/{branch_name}\", base_sha)\n    except GithubException as e:\n\
          \        if e.status != 422:   # 422 = branch already exists\n         \
          \   raise\n\n    # Read current deployment-green.yaml, update image digest\
          \ + MODEL_VERSION\n    file_content = repo.get_contents(gitops_green_file,\
          \ ref=branch_name)\n    current_yaml = file_content.decoded_content.decode()\n\
          \n    # Regex-replace the two fields we need to update\n    import re\n\
          \    # 1) modelcar initContainer image\n    new_yaml = re.sub(\n       \
          \ r'(image:\\s+)([^\\s]+/thor-builds/cosmos3-edge-modelcar@sha256:[a-f0-9]+)',\n\
          \        lambda m: m.group(1) + image_ref,\n        current_yaml,\n    )\n\
          \    # 2) MODEL_VERSION env var value\n    new_yaml = re.sub(\n        r'(-\
          \ name: MODEL_VERSION\\s+\\n\\s+value:\\s+\")[^\"]+(\")',\n        lambda\
          \ m: m.group(1) + model_version + m.group(2),\n        new_yaml,\n    )\n\
          \n    g1_loss    = report.get(\"final_loss\", 0)\n    g1_ckpt    = report.get(\"\
          checkpoint_iter\", \"none\")\n    v1_uri     = report.get(\"v1_dream_uri\"\
          ) or \"(not yet generated)\"\n    v2_uri     = report.get(\"v2_dream_uri\"\
          ) or \"(generated on-Thor after merge -- scale dreamer)\"\n\n    pr_body\
          \ = f\"\"\"## Automated model promotion -- {model_version}\n\n**Fine-tuning:**\
          \ cosmos-framework Vision SFT on Cosmos3-Edge (4B MoT Generator)\n**Decision:**\
          \ D032-A (Vision SFT, empirically confirmed on single L40S)\n**Recipe:**\
          \ `launch_sft_vision_edge.sh` (BridgeData2 video clips + structured captions)\n\
          \n**Gate 1 -- Training metrics:**\n\n| Metric | Value |\n|---|---|\n| Final\
          \ training loss | `{g1_loss:.4f}` |\n| Checkpoint | `{g1_ckpt}` |\n\n**Gate\
          \ 2 -- \"Dream before deploy\" (Forward Dynamics comparison):**\n\n| | Model\
          \ | Rollout video |\n|---|---|---|\n| Before promotion | `cosmos3-edge-v1`\
          \ | `{v1_uri}` |\n| After promotion | `{model_version}` | `{v2_uri}` |\n\
          \nThe v2 dream video is generated on-Thor after merge by scaling the dreamer\
          \ workload:\n`oc scale deployment dreamer -n flywheel --replicas=1` then\
          \ back to 0 when done.\nCompare the two MP4s: the fine-tuned Generator produces\
          \ smoother, more physically\ncoherent forward-dynamics rollouts from the\
          \ same conditioning frame + action chunk.\n\n**Modelcar digest:** `{digest}`\n\
          \n**What merging this PR does (Act 3 demo beat):**\n1. Argo syncs `deployment-green.yaml`\
          \ -- green pod starts, CRI-O verifies sigstore signature\n2. Cosmos3-Edge\
          \ Generator serves the Vision SFT checkpoint: improved I2V + action quality\n\
          3. Blue scales to 0; Service selector flips to green -- port 30800 routes\
          \ to new model\n4. Run dreamer (MODEL_VERSION=cosmos3-edge-v2) to produce\
          \ the post-promotion dream video\n5. Show Gate 2 side-by-side: v1 dream\
          \ vs v2 dream -- the flywheel improvement, visualized\n6. Perses: model.version\
          \ step-change panel shows generation quality improvement over time\n\n_Opened\
          \ automatically by the cosmos3_finetune_pipeline (cosmos-framework Vision\
          \ SFT, D032)_\n\"\"\"\n\n    repo.update_file(\n        gitops_green_file,\n\
          \        f\"promote: cosmos3-edge {model_version} modelcar digest + green\
          \ replicas=1\",\n        new_yaml.replace(\"replicas: 0\", \"replicas: 1\"\
          , 1),\n        file_content.sha,\n        branch=branch_name,\n    )\n\n\
          \    # Also set blue deployment to replicas=0 (Argo selfHeal prevents manual\n\
          \    # oc scale, so the replica flip MUST be in git for the merge to work).\n\
          \    blue_file = \"gitops/vllm-cosmos3/deployment.yaml\"\n    blue_content\
          \ = repo.get_contents(blue_file, ref=branch_name)\n    blue_yaml = blue_content.decoded_content.decode()\n\
          \    repo.update_file(\n        blue_file,\n        f\"promote: blue replicas=0\
          \ (green takes over)\",\n        blue_yaml.replace(\"replicas: 1\", \"replicas:\
          \ 0\", 1),\n        blue_content.sha,\n        branch=branch_name,\n   \
          \ )\n\n    pr = repo.create_pull(\n        title=f\"[promote] cosmos3-edge\
          \ {model_version}\",\n        body=pr_body,\n        head=branch_name,\n\
          \        base=\"main\",\n    )\n    print(f\"[promote] PR opened: {pr.html_url}\"\
          )\n    return pr.html_url\n\n"
