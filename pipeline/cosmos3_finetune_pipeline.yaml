          \ output into the KFP artifact path\n        export_path = out_dir / \"\
          model\"\n        export_path.mkdir(parents=True, exist_ok=True)\n      \
          \  import shutil as _sc\n        for item in scratch_diffusers.iterdir():\n\
          \            dest = export_path / item.name\n            if item.is_dir():\n\
          \                _sc.copytree(item, dest)\n            else:\n         \
