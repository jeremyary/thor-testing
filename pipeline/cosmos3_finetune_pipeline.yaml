# PIPELINE DEFINITION
# Name: cosmos3-edge-finetune
# Description: Phase 4 training pipeline: download BridgeData2 -> Vision SFT fine-tune Cosmos3-Edge -> Gate 1 eval -> package modelcar -> cosign sign -> open promotion PR (D032-A, empirically confirmed on single L40S)
# Inputs:
#    github_repo: str [Default: 'jeremyary/thor-testing']
#    image_name: str [Default: 'thor-builds/cosmos3-edge-modelcar']
#    max_steps: int [Default: 100.0]
#    model_id: str [Default: 'nvidia/Cosmos3-Edge']
#    model_version: str [Default: 'cosmos3-edge-v2']
#    registry: str [Default: 'default-route-openshift-image-registry.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com']
#    s3_access_key: str [Default: 'admin']
#    s3_bucket: str [Default: 'episodes-curated']
#    s3_endpoint: str [Default: 'http://minio.robotics-data.svc:9000']
#    s3_secret_key: str [Default: 'robotics-demo-2026']
#    threshold_loss: float [Default: 10.0]
components:
  comp-evaluate:
    executorLabel: exec-evaluate
    inputDefinitions:
      artifacts:
        checkpoint:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        episodes:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        threshold_loss:
          defaultValue: 10.0
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        report_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
  comp-finetune-cosmos3:
    executorLabel: exec-finetune-cosmos3
    inputDefinitions:
      artifacts:
        episodes:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        max_steps:
          defaultValue: 100.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        model_id:
          defaultValue: nvidia/Cosmos3-Edge
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        checkpoint_out:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: NUMBER_DOUBLE
  comp-gate2-dream-comparison:
    executorLabel: exec-gate2-dream-comparison
    inputDefinitions:
      artifacts:
        eval_report:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        model_version_v1:
          defaultValue: cosmos3-edge-v1
          isOptional: true
          parameterType: STRING
        model_version_v2:
          defaultValue: cosmos3-edge-v2
          isOptional: true
          parameterType: STRING
        s3_access_key:
          parameterType: STRING
        s3_bucket_eval:
          defaultValue: eval-reports
          isOptional: true
          parameterType: STRING
        s3_endpoint:
          parameterType: STRING
        s3_secret_key:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        gate2_report_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
  comp-ingest-episodes:
    executorLabel: exec-ingest-episodes
    inputDefinitions:
      parameters:
        dataset_pvc_path:
          defaultValue: /dataset/BridgeData2-Subset-Synthetic-Captions
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        episodes_out:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: NUMBER_INTEGER
  comp-open-promotion-pr:
    executorLabel: exec-open-promotion-pr
    inputDefinitions:
      artifacts:
        eval_report:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        image_ref_artifact:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        github_repo:
          defaultValue: jeremyary/thor-testing
          isOptional: true
          parameterType: STRING
        github_token_path:
          defaultValue: /etc/github/token
          isOptional: true
          parameterType: STRING
        gitops_green_file:
          defaultValue: gitops/vllm-cosmos3/deployment-green.yaml
          isOptional: true
          parameterType: STRING
        model_version:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-package-modelcar:
    executorLabel: exec-package-modelcar
    inputDefinitions:
      artifacts:
        checkpoint:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        eval_report:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        image_name:
          parameterType: STRING
        model_version:
          parameterType: STRING
        registry:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        image_ref_out:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
  comp-sign-modelcar:
    executorLabel: exec-sign-modelcar
    inputDefinitions:
      artifacts:
        image_ref_artifact:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        cosign_key_path:
          defaultValue: /etc/cosign/cosign.key
          isOptional: true
          parameterType: STRING
        rekor_url:
          defaultValue: https://rekor-server-trusted-artifact-signer.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-evaluate:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate(\n    checkpoint:              dsl.Input[dsl.Model],\n\
          \    episodes:                dsl.Input[dsl.Dataset],\n    threshold_loss:\
          \          float = 10.0,   # lenient for demo; tighten for prod\n    report_out:\
          \              dsl.Output[dsl.Dataset] = None,\n) -> str:\n    \"\"\"Gate\
          \ 1 evaluation -- training loss check (D032-A).\n\n    Reads training_meta.json\
          \ from the finetune step and checks:\n      - final_loss <= threshold_loss\
          \ (training converged)\n      - checkpoint_iter != \"none\" (training produced\
          \ a checkpoint)\n\n    For demo: threshold_loss=10.0 (always passes a real\
          \ training run).\n    For production: tighten to ~3.0 for BridgeData2 Vision\
          \ SFT.\n    \"\"\"\n    import json, pathlib, sys\n\n    checkpoint_dir\
          \ = pathlib.Path(checkpoint.path)\n    out            = pathlib.Path(report_out.path)\n\
          \    out.mkdir(parents=True, exist_ok=True)\n\n    meta       = json.loads((checkpoint_dir\
          \ / \"training_meta.json\").read_text())\n    final_loss = meta.get(\"final_loss\"\
          , 0.0)\n    ckpt_iter  = meta.get(\"checkpoint_iter\", \"none\")\n\n   \
          \ loss_ok       = final_loss > 0 and final_loss <= threshold_loss\n    ckpt_ok\
          \       = ckpt_iter != \"none\"\n    gate1_pass    = loss_ok and ckpt_ok\n\
          \n    report = {\n        \"final_loss\":          final_loss,\n       \
          \ \"threshold_loss\":      threshold_loss,\n        \"loss_ok\":       \
          \      loss_ok,\n        \"ckpt_ok\":             ckpt_ok,\n        \"checkpoint_iter\"\
          :     ckpt_iter,\n        \"gate1_pass\":          gate1_pass,\n       \
          \ \"max_steps\":           meta.get(\"max_steps\", 0),\n        \"max_tokens\"\
          :          meta.get(\"max_tokens\", 24576),\n        \"recipe\":       \
          \       meta.get(\"recipe\", \"\"),\n        \"cf_sha\":              meta.get(\"\
          cf_sha\", \"\"),\n        \"framework\":           meta.get(\"framework\"\
          , \"cosmos-framework\"),\n        \"decision\":            \"D032-A\",\n\
          \    }\n    (out / \"eval_report.json\").write_text(json.dumps(report, indent=2))\n\
          \    print(\n        f\"[evaluate] Gate 1: loss={final_loss:.4f} ckpt={ckpt_iter}\
          \ \"\n        f\"-> {'PASS' if gate1_pass else 'FAIL'}\"\n    )\n\n    if\
          \ not gate1_pass:\n        print(\"[evaluate] FAIL -- Gate 1 thresholds\
          \ not met, pipeline aborted\")\n        sys.exit(1)\n\n    print(\"[evaluate]\
          \ Gate 1 PASS\")\n    return \"PASS\"\n\n"
        image: python:3.12-slim
    exec-finetune-cosmos3:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - finetune_cosmos3
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef finetune_cosmos3(\n    episodes:       dsl.Input[dsl.Dataset],\n\
          \    model_id:       str   = \"nvidia/Cosmos3-Edge\",\n    max_steps:  \
          \    int   = 100,      # 100 for demo (~19 min on L40S); 500 for full\n\
          \    checkpoint_out: dsl.Output[dsl.Model] = None,\n) -> float:\n    \"\"\
          \"Cosmos3-Edge Vision SFT via cosmos-framework (D032-A).\n\n    Fine-tunes\
          \ the Cosmos3-Edge Generator (4B MoT) on BridgeData2 video clips\n    with\
          \ structured captions using NVIDIA's real launch_sft_vision_edge.sh recipe.\n\
          \n    Empirically confirmed on single L40S (45GB) on 2026-08-14:\n     \
          \ - 10 iters: loss 2.45-3.13, ~11.5s/iter, peak GPU ~39GB\n      - Memory\
          \ knobs: expandable_segments + max_tokens 24576\n\n    Framework: NVIDIA/cosmos-framework\
          \ (SHA b28c027)\n    Recipe: examples/launch_sft_vision_edge.sh (vision_sft_edge.toml)\n\
          \    Data: BridgeData2 video clips + structured JSON captions (JSONL)\n\
          \    Install: uv sync --all-extras --group=cu130-train (torch 2.10+cu130)\n\
          \    \"\"\"\n    import subprocess, pathlib, json, os, sys, re\n\n    out_dir\
          \ = pathlib.Path(checkpoint_out.path)\n    out_dir.mkdir(parents=True, exist_ok=True)\n\
          \n    # Locate the dataset -- ingest_episodes writes dataset_path.txt pointing\n\
          \    # to the pre-staged PVC location\n    data_root = pathlib.Path(episodes.path)\n\
          \    path_file = data_root / \"dataset_path.txt\"\n    if path_file.exists():\n\
          \        dataset_path = pathlib.Path(path_file.read_text().strip())\n  \
          \  else:\n        # Fallback: search for the JSONL directly\n        jsonl_candidates\
          \ = list(data_root.rglob(\"video_dataset_file.jsonl\"))\n        if not\
          \ jsonl_candidates:\n            print(\"[finetune] ERROR: no dataset found\"\
          )\n            meta = {\"model_id\": model_id, \"max_steps\": 0, \"final_loss\"\
          : 0.0,\n                    \"error\": \"no dataset\", \"decision\": \"\
          D032-A\"}\n            (out_dir / \"training_meta.json\").write_text(json.dumps(meta,\
          \ indent=2))\n            return 0.0\n        dataset_path = jsonl_candidates[0].parent.parent\n\
          \n    jsonl_path = dataset_path / \"train\" / \"video_dataset_file.jsonl\"\
          \n    assert jsonl_path.exists(), f\"JSONL not found at {jsonl_path}\"\n\
          \    train_count = sum(1 for _ in jsonl_path.open())\n    print(f\"[finetune]\
          \ dataset={dataset_path} clips={train_count} max_steps={max_steps}\")\n\n\
          \    # -----------------------------------------------------------------------\n\
          \    # Step 1: Setup -- writable HOME, ffprobe, clone cosmos-framework\n\
          \    # /scratch is a persistent PVC reused across runs: the venv, model\
          \ DCP, and\n    # cosmos-framework clone are cached (guarded by exists()\
          \ checks below) to\n    # speed up subsequent runs. But training OUTPUTS\
          \ must be fresh each run so a\n    # stale checkpoint from a failed prior\
          \ run can't be mistaken for this run's\n    # result -- clear the run output\
          \ dir up front.\n    # -----------------------------------------------------------------------\n\
          \    import shutil as _shutil\n    scratch = pathlib.Path(\"/scratch\")\n\
          \    scratch.mkdir(exist_ok=True)\n    home = scratch / \"home\"\n    home.mkdir(exist_ok=True)\n\
          \    hf_home = scratch / \"hf\"\n    hf_home.mkdir(exist_ok=True)\n    stale_run\
          \ = scratch / \"outputs\" / \"train\" / \"cosmos3\" / \"sft\" / \"vision_sft_edge\"\
          \n    if stale_run.exists():\n        print(f\"[finetune] clearing stale\
          \ run output: {stale_run}\")\n        _shutil.rmtree(stale_run, ignore_errors=True)\n\
          \n    env = os.environ.copy()\n    env.update({\n        \"HOME\":   str(home),\n\
          \        \"HF_HOME\": str(hf_home),\n        \"PATH\":   f\"{scratch}/bin:{home}/.local/bin:{env.get('PATH',\
          \ '')}\",\n        \"PYTORCH_ALLOC_CONF\": \"expandable_segments:True\"\
          ,  # D032-A memory fix\n    })\n\n    # Install uv\n    subprocess.run([sys.executable,\
          \ \"-m\", \"pip\", \"install\", \"--user\", \"uv\"],\n                 \
          \  env=env, check=True, capture_output=True)\n\n    # Install ffmpeg + ffprobe\
          \ (static build -- can't apt-get as non-root in\n    # OpenShift). The cosmos-framework\
          \ video dataloader shells out to BOTH:\n    # ffprobe for metadata and ffmpeg\
          \ for decoding the .mp4 clips.\n    ffbin = scratch / \"bin\"\n    ffbin.mkdir(exist_ok=True)\n\
          \    if not (ffbin / \"ffmpeg\").exists() or not (ffbin / \"ffprobe\").exists():\n\
          \        print(\"[finetune] installing static ffmpeg + ffprobe...\")\n \
          \       subprocess.run([\n            \"sh\", \"-c\",\n            f\"curl\
          \ -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz\
          \ \"\n            f\"-o {scratch}/ff.tar.xz && \"\n            f\"tar xf\
          \ {scratch}/ff.tar.xz -C {scratch} && \"\n            f\"cp {scratch}/ffmpeg-*-amd64-static/ffmpeg\
          \ {scratch}/ffmpeg-*-amd64-static/ffprobe {ffbin}/\"\n        ], env=env,\
          \ check=True)\n\n    # Clone cosmos-framework at pinned SHA\n    cf_sha\
          \ = \"b28c027628db987d8eaa558faedc1d37d11125ae\"\n    cf_dir = scratch /\
          \ \"cosmos-framework\"\n    if not cf_dir.exists():\n        print(f\"[finetune]\
          \ cloning cosmos-framework @ {cf_sha[:12]}...\")\n        subprocess.run([\n\
          \            \"git\", \"clone\", \"https://github.com/NVIDIA/cosmos-framework.git\"\
          ,\n            str(cf_dir),\n        ], env=env, check=True, capture_output=True)\n\
          \        subprocess.run([\"git\", \"checkout\", cf_sha],\n             \
          \          cwd=str(cf_dir), env=env, check=True, capture_output=True)\n\n\
          \    # -----------------------------------------------------------------------\n\
          \    # Step 2: Install dependencies (uv sync -- documented, tested combo)\n\
          \    # Must use cu130-train (NOT cu130-torch213-train -- torchvision mismatch)\n\
          \    # -----------------------------------------------------------------------\n\
          \    uv_bin = f\"{home}/.local/bin/uv\"\n    if not (cf_dir / \".venv\"\
          ).exists():\n        print(\"[finetune] uv sync --all-extras --group=cu130-train\
          \ ...\")\n        subprocess.run([\n            uv_bin, \"sync\", \"--all-extras\"\
          , \"--group=cu130-train\",\n        ], cwd=str(cf_dir), env=env, check=True,\
          \ capture_output=True)\n\n    # -----------------------------------------------------------------------\n\
          \    # Step 3: Convert HF checkpoint to DCP (required for Vision SFT)\n\
          \    # -----------------------------------------------------------------------\n\
          \    dcp_dir = cf_dir / \"examples\" / \"checkpoints\" / \"Cosmos3-Edge\"\
          \n    if not dcp_dir.exists():\n        print(\"[finetune] converting Cosmos3-Edge\
          \ HF -> DCP ...\")\n        subprocess.run([\n            uv_bin, \"run\"\
          , \"python\", \"-m\",\n            \"cosmos_framework.scripts.convert_model_to_dcp\"\
          ,\n            \"-o\", str(dcp_dir),\n            \"--checkpoint-path\"\
          , \"Cosmos3-Edge\",\n        ], cwd=str(cf_dir), env=env, check=True)\n\n\
          \    # Wan2.2 VAE is auto-downloaded by the converter; find it\n    vae_candidates\
          \ = list(pathlib.Path(hf_home).rglob(\"Wan2.2_VAE.pth\"))\n    assert vae_candidates,\
          \ \"Wan2.2 VAE not found in HF cache after DCP conversion\"\n    wan_vae_path\
          \ = str(vae_candidates[0])\n\n    # -----------------------------------------------------------------------\n\
          \    # Step 4: Patch the TOML recipe for single-L40S (D032-A memory knobs)\n\
          \    # -----------------------------------------------------------------------\n\
          \    toml_path = cf_dir / \"examples\" / \"toml\" / \"sft_config\" / \"\
          vision_sft_edge.toml\"\n    toml_text = toml_path.read_text()\n    # Reduce\
          \ packing cap: 45056 -> 24576 (fits 39/45GB instead of OOM)\n    toml_text\
          \ = toml_text.replace(\n        \"max_num_tokens_after_packing = 45056\"\
          ,\n        \"max_num_tokens_after_packing = 24576\",\n    )\n    toml_text\
          \ = toml_text.replace(\n        \"max_sequence_length = 45056\",\n     \
          \   \"max_sequence_length = 24576\",\n    )\n    # Set max_iter and save_iter\
          \ to user's requested steps\n    toml_text = re.sub(r\"max_iter\\s*=\\s*\\\
          d+\", f\"max_iter                = {max_steps}\", toml_text)\n    toml_text\
          \ = re.sub(r\"save_iter\\s*=\\s*\\d+\", f\"save_iter            = {max_steps}\"\
          , toml_text)\n    toml_path.write_text(toml_text)\n\n    # -----------------------------------------------------------------------\n\
          \    # Step 5: Run training via the real launch_sft_vision_edge.sh\n   \
          \ # -----------------------------------------------------------------------\n\
          \    train_env = env.copy()\n    train_env.update({\n        \"DATASET_PATH\"\
          :         str(dataset_path),\n        \"BASE_CHECKPOINT_PATH\": str(dcp_dir),\n\
          \        \"WAN_VAE_PATH\":         wan_vae_path,\n        \"NPROC_PER_NODE\"\
          :       \"1\",\n        \"IMAGINAIRE_OUTPUT_ROOT\": str(scratch / \"outputs\"\
          \ / \"train\"),\n    })\n    # Activate the venv so torchrun resolves to\
          \ the correct python\n    venv_bin = str(cf_dir / \".venv\" / \"bin\")\n\
          \    train_env[\"PATH\"] = f\"{ffbin}:{venv_bin}:{train_env['PATH']}\"\n\
          \    # Ensure VIRTUAL_ENV is set so the launcher finds everything\n    train_env[\"\
          VIRTUAL_ENV\"] = str(cf_dir / \".venv\")\n\n    print(f\"[finetune] launching\
          \ Vision SFT: max_steps={max_steps}, NPROC=1\")\n    # Capture stdout so\
          \ we can parse the final loss directly (the launcher's\n    # own log lands\
          \ under $OUTPUT_ROOT/logs/, a different dir from the run dir).\n    result\
          \ = subprocess.run(\n        [\"bash\", \"examples/launch_sft_vision_edge.sh\"\
          ],\n        cwd=str(cf_dir), env=train_env,\n        stdout=subprocess.PIPE,\
          \ stderr=subprocess.STDOUT, text=True,\n    )\n    train_stdout = result.stdout\
          \ or \"\"\n    print(train_stdout)  # surface training output in the KFP\
          \ pod logs\n    if result.returncode != 0:\n        print(f\"[finetune]\
          \ training exit code {result.returncode} -- checking checkpoint...\")\n\n\
          \    # -----------------------------------------------------------------------\n\
          \    # Step 6: Export DCP checkpoint -> Diffusers pipeline directory\n \
          \   #\n    # NVIDIA's documented two-step conversion:\n    #   6a. export_model:\
          \ DCP -> safetensors (cosmos-framework internal format)\n    #   6b. convert_model_to_diffusers:\
          \ safetensors -> Diffusers pipeline layout\n    #       (transformer/, vae/,\
          \ scheduler/, model_index.json, etc.)\n    #\n    # vllm-omni serves via\
          \ Cosmos3OmniDiffusersPipeline, which auto-resolves\n    # from model_index.json.\
          \ Without Step 6b, the export has flat safetensors\n    # with cosmos-framework\
          \ tensor names that vllm-omni cannot load.\n    #\n    # Both steps write\
          \ to scratch (reliable local FS) first, then copy into\n    # the KFP artifact\
          \ path \u2014 writing multi-GB safetensors directly to the\n    # S3 FUSE\
          \ mount loses files during KFP's artifact upload.\n    # -----------------------------------------------------------------------\n\
          \    run_subdir = scratch / \"outputs\" / \"train\" / \"cosmos3\" / \"sft\"\
          \ / \"vision_sft_edge\"\n    ckpt_ptr   = run_subdir / \"checkpoints\" /\
          \ \"latest_checkpoint.txt\"\n    final_loss = 0.0\n\n    if ckpt_ptr.exists():\n\
          \        ckpt_iter   = ckpt_ptr.read_text().strip()\n        ckpt_path \
          \  = run_subdir / \"checkpoints\" / ckpt_iter\n        config_f    = run_subdir\
          \ / \"config.yaml\"\n\n        # Step 6a: export_model (DCP -> safetensors)\n\
          \        # Free scratch space first: the DCP checkpoint (~8GB) and all training\n\
          \        # checkpoints except the one we're exporting are no longer needed.\n\
          \        # The 60Gi scratch PVC holds venv (6GB) + HF model (12GB) + DCP\
          \ (8GB)\n        # + training outputs (8GB) = ~34GB used. The export + diffusers\n\
          \        # conversion need ~16GB more, so reclaim the DCP to stay within\
          \ budget.\n        import shutil as _cleanup\n        dcp_dir = cf_dir /\
          \ \"examples\" / \"checkpoints\" / \"Cosmos3-Edge\"\n        if dcp_dir.exists():\n\
          \            _cleanup.rmtree(dcp_dir)\n            print(\"[finetune] freed\
          \ DCP checkpoint from scratch\")\n\n        scratch_export = scratch / \"\
          exported_model\"\n        if scratch_export.exists():\n            _cleanup.rmtree(scratch_export)\n\
          \        print(f\"[finetune] Step 6a: exporting {ckpt_iter} -> {scratch_export}...\"\
          )\n        subprocess.run([\n            uv_bin, \"run\", \"python\", \"\
          -m\",\n            \"cosmos_framework.scripts.export_model\",\n        \
          \    \"--checkpoint-path\", str(ckpt_path),\n            \"--config-file\"\
          ,    str(config_f),\n            \"-o\",               str(scratch_export),\n\
