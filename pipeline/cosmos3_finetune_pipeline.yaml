          \ /usr/local/bin read-only).\n    import urllib.request, tarfile\n    print(\"\
          [package] downloading crane...\")\n    bindir = pathlib.Path(\"/tmp/bin\"\
          )\n    bindir.mkdir(parents=True, exist_ok=True)\n    crane = bindir / \"\
          crane\"\n    if not crane.exists():\n        url = (\"https://github.com/google/go-containerregistry/releases/latest/download/\"\
          \n               \"go-containerregistry_Linux_x86_64.tar.gz\")\n       \
          \ tgz = \"/tmp/crane.tar.gz\"\n        urllib.request.urlretrieve(url, tgz)\n\
          \        with tarfile.open(tgz) as t:\n            t.extract(\"crane\",\
          \ path=str(bindir))\n        crane.chmod(0o755)\n\n    # Authenticate crane\
          \ to the internal registry using the pod's SA token.\n    # pipeline-runner-dspa\
          \ was granted system:image-builder on thor-builds.\n    # crane reads $DOCKER_CONFIG/config.json\
          \ -- write it directly rather than\n    # `crane auth login` (which writes\
          \ to $HOME/.docker, and HOME=/ is read-only\n    # under restricted-v2).\n\
          \    import base64 as _b64\n    sa_token = pathlib.Path(\n        \"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
          \n    ).read_text().strip()\n    docker_cfg_dir = pathlib.Path(\"/tmp/dockercfg\"\
          )\n    docker_cfg_dir.mkdir(parents=True, exist_ok=True)\n    auth = _b64.b64encode(f\"\
          pipeline-runner-dspa:{sa_token}\".encode()).decode()\n    (docker_cfg_dir\
          \ / \"config.json\").write_text(json.dumps({\n        \"auths\": {registry:\
          \ {\"auth\": auth}}\n    }))\n    crane_env = os.environ.copy()\n    crane_env[\"\
          DOCKER_CONFIG\"] = str(docker_cfg_dir)\n    print(\"[package] configured\
          \ crane registry auth (SA token)\")\n\n    image_ref = f\"{registry}/{image_name}:{model_version}\"\
          \n    print(f\"[package] building modelcar -> {image_ref}\")\n\n    # Stage\
          \ the checkpoint in the HuggingFace cache directory layout.\n    # The green\
          \ deployment's entrypoint does:\n    #   snapshot_download('nvidia/Cosmos3-Edge',\
          \ local_files_only=True)\n    # which expects the HF cache hierarchy:\n\
          \    #   hub/models--nvidia--Cosmos3-Edge/snapshots/<hash>/<files>\n   \
          \ # The initContainer copies /models/huggingface/. -> /hf-cache/ which is\n\
          \    # mounted at /root/.cache/huggingface in the main container.\n    import\
          \ shutil as _shutil2, hashlib as _hashlib\n    staging = pathlib.Path(\"\
          /tmp/modelcar-staging\")\n    if staging.exists():\n        _shutil2.rmtree(staging)\n\
          \n    # Create the HF cache structure with a synthetic snapshot hash\n \
          \   model_src = checkpoint_dir / \"model\" if (checkpoint_dir / \"model\"\
          ).exists() else checkpoint_dir\n    snap_hash = _hashlib.sha256(model_version.encode()).hexdigest()[:40]\n\
          \    snap_dir  = staging / \"models\" / \"huggingface\" / \"hub\" / \"models--nvidia--Cosmos3-Edge\"\
          \ / \"snapshots\" / snap_hash\n    snap_dir.mkdir(parents=True)\n\n    #\
          \ Copy exported safetensors into the snapshot\n    for item in model_src.iterdir():\n\
          \        dest = snap_dir / item.name\n        if item.is_dir():\n      \
          \      _shutil2.copytree(item, dest)\n        else:\n            _shutil2.copy2(item,\
          \ dest)\n\n    # Write the refs/main pointer so snapshot_download finds\
          \ it\n    refs_dir = snap_dir.parent.parent / \"refs\"\n    refs_dir.mkdir(parents=True,\
          \ exist_ok=True)\n    (refs_dir / \"main\").write_text(snap_hash)\n\n  \
          \  print(f\"[package] staged {sum(1 for _ in snap_dir.rglob('*'))} files\
          \ in HF cache layout (snap={snap_hash[:12]})\")\n\n    with tempfile.NamedTemporaryFile(suffix=\"\
          .tar\", delete=False) as tmp:\n        layer_tar = tmp.name\n\n    subprocess.run([\n\
          \        \"tar\", \"-cf\", layer_tar,\n        \"-C\", str(staging),\n \
          \       \"models\",\n    ], check=True)\n\n    # crane append: base=ubi9-micro\
          \ (arm64 -- Thor is Jetson aarch64).\n    # crane defaults to amd64 when\
          \ resolving a multi-arch base, which produces\n    # an x86_64 image that\
          \ fails with \"Exec format error\" on Thor. Pinning to\n    # linux/arm64\
          \ ensures bash/cp in the initContainer works on the Jetson.\n    subprocess.run([\n\
          \        str(crane), \"append\",\n        \"--platform\", \"linux/arm64\"\
          ,\n        \"--base\", \"registry.access.redhat.com/ubi9/ubi-micro:latest\"\
          ,\n        \"--new_layer\", layer_tar,\n        \"--new_tag\", image_ref,\n\
          \    ], check=True, env=crane_env)\n\n    os.unlink(layer_tar)\n\n    #\
          \ Resolve by digest (per D014 convention)\n    result = subprocess.run(\n\
          \        [str(crane), \"digest\", image_ref],\n        capture_output=True,\
          \ text=True, check=True, env=crane_env,\n    )\n    digest = result.stdout.strip()\n\
          \    image_ref_by_digest = f\"{registry}/{image_name}@{digest}\"\n    print(f\"\
          [package] pushed -> {image_ref_by_digest}\")\n\n    meta = {\"image_ref\"\
          : image_ref_by_digest, \"tag\": image_ref, \"digest\": digest}\n    (out_dir\
          \ / \"image_ref.json\").write_text(json.dumps(meta))\n    return image_ref_by_digest\n\
          \n"
        image: python:3.12-slim
    exec-sign-modelcar:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - sign_modelcar
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef sign_modelcar(\n    image_ref_artifact: dsl.Input[dsl.Artifact],\n\
          \    cosign_key_path:    str = \"/etc/cosign/cosign.key\",\n    rekor_url:\
          \          str = \"https://rekor-server-trusted-artifact-signer.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com\"\
          ,\n) -> str:\n    \"\"\"cosign sign the modelcar by digest. Uses the same\
          \ static keypair + RHTAS\n    Rekor as the Tekton OS-image pipeline (D008/D022).\"\
          \"\"\n    import subprocess, pathlib, json, os\n\n    art_dir   = pathlib.Path(image_ref_artifact.path)\n\
          \    meta      = json.loads((art_dir / \"image_ref.json\").read_text())\n\
          \    image_ref = meta[\"image_ref\"]\n\n    # Download cosign via urllib\
          \ into a writable dir -- non-root UID under\n    # restricted-v2 SCC (no\
          \ apt-get, /usr/local/bin read-only).\n    import platform, urllib.request\n\
          \    arch = \"amd64\" if platform.machine() == \"x86_64\" else \"arm64\"\
          \n    print(f\"[sign] downloading cosign for {arch}...\")\n    bindir =\
          \ pathlib.Path(\"/tmp/bin\")\n    bindir.mkdir(parents=True, exist_ok=True)\n\
          \    cosign = bindir / \"cosign\"\n    if not cosign.exists():\n       \
          \ url = f\"https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-{arch}\"\
          \n        urllib.request.urlretrieve(url, str(cosign))\n        cosign.chmod(0o755)\n\
          \n    # cosign pushes the signature to the registry -- authenticate first\
          \ via a\n    # docker config the pod's SA token, written to a writable DOCKER_CONFIG\
          \ dir.\n    import base64 as _b64\n    registry_host = image_ref.split(\"\
          /\")[0]\n    sa_token = pathlib.Path(\n        \"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
          \n    ).read_text().strip()\n    docker_cfg_dir = pathlib.Path(\"/tmp/dockercfg\"\
          )\n    docker_cfg_dir.mkdir(parents=True, exist_ok=True)\n    auth = _b64.b64encode(f\"\
          pipeline-runner-dspa:{sa_token}\".encode()).decode()\n    (docker_cfg_dir\
          \ / \"config.json\").write_text(json.dumps({\n        \"auths\": {registry_host:\
          \ {\"auth\": auth}}\n    }))\n\n    print(f\"[sign] cosign sign {image_ref}\"\
          )\n    env = os.environ.copy()\n    env[\"COSIGN_PASSWORD\"] = \"\"  # key\
          \ is unencrypted in the Secret (matches D008)\n    env[\"DOCKER_CONFIG\"\
          ] = str(docker_cfg_dir)\n    subprocess.run([\n        str(cosign), \"sign\"\
          ,\n        \"--key\",        cosign_key_path,\n        \"--rekor-url\",\
          \  rekor_url,\n        \"--tlog-upload=true\",\n        \"-y\",\n      \
          \  image_ref,\n    ], check=True, env=env)\n    print(f\"[sign] signed ->\
          \ Rekor entry logged\")\n    return image_ref\n\n"
        image: python:3.12-slim
pipelineInfo:
  description: 'Phase 4 training pipeline: download BridgeData2 -> Vision SFT fine-tune
    Cosmos3-Edge -> Gate 1 eval -> package modelcar -> cosign sign -> open promotion
    PR (D032-A, empirically confirmed on single L40S)'
  name: cosmos3-edge-finetune
root:
  dag:
    tasks:
      evaluate:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate
        dependentTasks:
        - finetune-cosmos3
        - ingest-episodes
        inputs:
          artifacts:
            checkpoint:
              taskOutputArtifact:
                outputArtifactKey: checkpoint_out
                producerTask: finetune-cosmos3
            episodes:
              taskOutputArtifact:
                outputArtifactKey: episodes_out
                producerTask: ingest-episodes
          parameters:
            threshold_loss:
              componentInputParameter: threshold_loss
        taskInfo:
          name: evaluate
      finetune-cosmos3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-finetune-cosmos3
        dependentTasks:
        - ingest-episodes
        inputs:
          artifacts:
            episodes:
              taskOutputArtifact:
                outputArtifactKey: episodes_out
                producerTask: ingest-episodes
          parameters:
            max_steps:
              componentInputParameter: max_steps
            model_id:
              componentInputParameter: model_id
        taskInfo:
          name: finetune-cosmos3
      gate2-dream-comparison:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-gate2-dream-comparison
        dependentTasks:
        - evaluate
        inputs:
          artifacts:
            eval_report:
              taskOutputArtifact:
                outputArtifactKey: report_out
                producerTask: evaluate
          parameters:
            model_version_v1:
              runtimeValue:
                constant: cosmos3-edge-v1
            model_version_v2:
              componentInputParameter: model_version
            s3_access_key:
              componentInputParameter: s3_access_key
            s3_endpoint:
              componentInputParameter: s3_endpoint
            s3_secret_key:
              componentInputParameter: s3_secret_key
        taskInfo:
          name: gate2-dream-comparison
      ingest-episodes:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-ingest-episodes
        taskInfo:
          name: ingest-episodes
      open-promotion-pr:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-open-promotion-pr
        dependentTasks:
        - gate2-dream-comparison
        - package-modelcar
        inputs:
          artifacts:
            eval_report:
              taskOutputArtifact:
                outputArtifactKey: gate2_report_out
                producerTask: gate2-dream-comparison
            image_ref_artifact:
              taskOutputArtifact:
                outputArtifactKey: image_ref_out
                producerTask: package-modelcar
          parameters:
            github_repo:
              componentInputParameter: github_repo
            model_version:
              componentInputParameter: model_version
        taskInfo:
          name: open-promotion-pr
      package-modelcar:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-package-modelcar
        dependentTasks:
        - evaluate
        - finetune-cosmos3
        inputs:
          artifacts:
            checkpoint:
              taskOutputArtifact:
                outputArtifactKey: checkpoint_out
                producerTask: finetune-cosmos3
            eval_report:
              taskOutputArtifact:
                outputArtifactKey: report_out
                producerTask: evaluate
          parameters:
            image_name:
              componentInputParameter: image_name
            model_version:
              componentInputParameter: model_version
            registry:
              componentInputParameter: registry
        taskInfo:
          name: package-modelcar
      sign-modelcar:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-sign-modelcar
        dependentTasks:
        - package-modelcar
        inputs:
          artifacts:
            image_ref_artifact:
              taskOutputArtifact:
                outputArtifactKey: image_ref_out
                producerTask: package-modelcar
        taskInfo:
          name: sign-modelcar
  inputDefinitions:
    parameters:
      github_repo:
        defaultValue: jeremyary/thor-testing
        isOptional: true
        parameterType: STRING
      image_name:
        defaultValue: thor-builds/cosmos3-edge-modelcar
        isOptional: true
        parameterType: STRING
      max_steps:
        defaultValue: 100.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      model_id:
        defaultValue: nvidia/Cosmos3-Edge
        isOptional: true
        parameterType: STRING
      model_version:
        defaultValue: cosmos3-edge-v2
        isOptional: true
        parameterType: STRING
      registry:
        defaultValue: default-route-openshift-image-registry.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com
        isOptional: true
        parameterType: STRING
      s3_access_key:
        defaultValue: admin
        isOptional: true
        parameterType: STRING
      s3_bucket:
        defaultValue: episodes-curated
        isOptional: true
        parameterType: STRING
      s3_endpoint:
        defaultValue: http://minio.robotics-data.svc:9000
        isOptional: true
        parameterType: STRING
      s3_secret_key:
        defaultValue: robotics-demo-2026
        isOptional: true
        parameterType: STRING
      threshold_loss:
        defaultValue: 10.0
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-finetune-cosmos3:
          emptyDirMounts:
          - medium: Memory
            mountPath: /dev/shm
            sizeLimit: 16Gi
            volumeName: dshm
          podMetadata:
            labels:
              kueue.x-k8s.io/queue-name: robotics-train
          pvcMount:
          - constant: bridgedata2-dataset
            mountPath: /dataset
            pvcNameParameter:
              runtimeValue:
                constant: bridgedata2-dataset
          - constant: finetune-scratch
            mountPath: /scratch
            pvcNameParameter:
              runtimeValue:
                constant: finetune-scratch
          tolerations:
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Equal
            value: L40S_SHARED
        exec-ingest-episodes:
          pvcMount:
          - constant: bridgedata2-dataset
            mountPath: /dataset
            pvcNameParameter:
              runtimeValue:
                constant: bridgedata2-dataset
        exec-open-promotion-pr:
          secretAsVolume:
          - mountPath: /etc/github
            optional: false
            secretName: github-token
            secretNameParameter:
              runtimeValue:
                constant: github-token
        exec-sign-modelcar:
          secretAsVolume:
          - mountPath: /etc/cosign
            optional: false
            secretName: cosign-signing-key
            secretNameParameter:
              runtimeValue:
                constant: cosign-signing-key
