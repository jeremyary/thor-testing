    exec-gate2-dream-comparison:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - gate2_dream_comparison
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3==1.35.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef gate2_dream_comparison(\n    eval_report:       dsl.Input[dsl.Dataset],\n\
          \    s3_endpoint:       str,\n    s3_access_key:     str,\n    s3_secret_key:\
          \     str,\n    s3_bucket_eval:    str  = \"eval-reports\",\n    model_version_v1:\
          \  str  = \"cosmos3-edge-v1\",\n    model_version_v2:  str  = \"cosmos3-edge-v2\"\
          ,\n    gate2_report_out:  dsl.Output[dsl.Dataset] = None,\n) -> str:\n \
          \   \"\"\"Gate 2: 'dream before deploy' -- compare pre- vs post-promotion\
          \ rollouts.\n\n    Retrieves Forward Dynamics rollout videos from MinIO\
          \ (generated on-Thor by\n    the dreamer workload) for both the pre-promotion\
          \ model (v1) and the\n    post-promotion model (v2). Compares them on the\
          \ curation-quality proxy\n    (which action chunk was selected for each\
          \ dream) and produces a Gate 2\n    report with S3 URIs for both rollout\
          \ videos.\n\n    These URIs are embedded in the promotion PR body so reviewers\
          \ see the\n    before/after dream comparison side-by-side before merging.\n\
          \n    Design note (D030-C, ii-b): Gate 2 compares WHICH action chunk the\n\
          \    fine-tuned Reasoner selects (good vs bad), not the chunk values themselves.\n\
          \    Both rollout videos use the same real UMI action chunks; the difference\
          \ is\n    which selection the trained model makes. The dreamer runs on-Thor\
          \ using\n    the same BridgeData2 frame + the curated episode's dream_action_chunk.\n\
          \    \"\"\"\n    import boto3, json, pathlib\n\n    out      = pathlib.Path(gate2_report_out.path)\n\
          \    out.mkdir(parents=True, exist_ok=True)\n    eval_dir = pathlib.Path(eval_report.path)\n\
          \    report   = json.loads((eval_dir / \"eval_report.json\").read_text())\n\
          \n    s3 = boto3.client(\n        \"s3\",\n        endpoint_url        \
          \  = s3_endpoint,\n        aws_access_key_id     = s3_access_key,\n    \
          \    aws_secret_access_key = s3_secret_key,\n    )\n\n    def find_latest_dream(model_version:\
          \ str) -> str | None:\n        \"\"\"Find the most recent Forward Dynamics\
          \ rollout for a model version.\"\"\"\n        prefix   = f\"dreams/\"\n\
          \        try:\n            paginator = s3.get_paginator(\"list_objects_v2\"\
          )\n            matches   = []\n            for page in paginator.paginate(Bucket=s3_bucket_eval,\
          \ Prefix=prefix):\n                for obj in page.get(\"Contents\", []):\n\
          \                    key = obj[\"Key\"]\n                    if key.endswith(f\"\
          -{model_version}.mp4\"):\n                        matches.append((obj[\"\
          LastModified\"], key))\n            if matches:\n                matches.sort(key=lambda\
          \ x: x[0], reverse=True)\n                key = matches[0][1]\n        \
          \        return f\"s3://{s3_bucket_eval}/{key}\"\n        except Exception\
          \ as e:\n            print(f\"[gate2] S3 lookup failed for {model_version}:\
          \ {e}\")\n        return None\n\n    v1_uri = find_latest_dream(model_version_v1)\n\
          \    v2_uri = find_latest_dream(model_version_v2)\n\n    # Gate 2 verdict:\
          \ pass if we have at least one dream video to show.\n    # In demo context,\
          \ v2 dream is generated AFTER promotion; the pipeline\n    # records both\
          \ URIs in the PR body for post-merge comparison.\n    # For a pre-baked\
          \ demo run, both URIs are populated from a prior dreamer run.\n    gate2_pass\
          \ = v1_uri is not None  # v2 generated post-merge\n\n    gate2_report =\
          \ {\n        \"gate2_pass\":         gate2_pass,\n        \"v1_dream_uri\"\
          :       v1_uri,\n        \"v2_dream_uri\":       v2_uri,\n        \"model_version_v1\"\
          :   model_version_v1,\n        \"model_version_v2\":   model_version_v2,\n\
          \        \"s3_bucket_eval\":     s3_bucket_eval,\n        \"gate1_parse_rate\"\
          :   report.get(\"parse_rate\", 0),\n        \"gate1_good_sel_rate\": report.get(\"\
          good_sel_rate\", 0),\n        \"note\": (\n            \"v2 dream generated\
          \ on-Thor post-promotion by dreamer workload \"\n            \"(scale deployment/dreamer\
          \ --replicas=1 after merge). \"\n            \"Compare v1 vs v2 rollout\
          \ to see the flywheel's improvement \"\n            \"in action-chunk selection\
          \ quality (D030-C, ii-b).\"\n        ),\n    }\n    (out / \"gate2_report.json\"\
          ).write_text(json.dumps(gate2_report, indent=2))\n    print(\n        f\"\
          [gate2] v1_dream={'found' if v1_uri else 'not yet'} \"\n        f\"v2_dream={'found'\
          \ if v2_uri else 'generated post-merge'} \"\n        f\"gate2={'PASS' if\
          \ gate2_pass else 'PENDING'}\"\n    )\n    return \"PASS\" if gate2_pass\
          \ else \"PENDING\"\n\n"
        image: python:3.12-slim
    exec-ingest-episodes:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - ingest_episodes
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'boto3==1.35.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef ingest_episodes(\n    s3_endpoint:   str,\n    s3_bucket:   \
          \  str,\n    s3_access_key: str,\n    s3_secret_key: str,\n    train_split:\
          \   float = 0.8,\n    episodes_out:  dsl.Output[dsl.Dataset] = None,\n)\
          \ -> int:\n    \"\"\"Download curated episodes from MinIO; convert to cosmos-framework\
          \ Reasoner SFT JSONL.\n\n    cosmos-framework Reasoner SFT expects JSONL\
          \ where each line is a conversation\n    record in the Qwen3-VL VLM format:\n\
          \      {\n        \"conversations\": [\n          {\"from\": \"human\",\
          \    \"value\": \"<image>\\\\nScene: <desc>. Choose action strategy.\"},\n\
          \          {\"from\": \"assistant\", \"value\": \"<JSON reasoning output>\"\
          }\n        ],\n        \"image\": \"<base64-encoded-frame-or-path>\"  #\
          \ optional; text-only if absent\n      }\n\n    Each curated episode contributes\
          \ one training example per tick where the\n    reasoning was valid (valid=True\
          \ in tick_data[i].reasoning). The target output\n    is the Reasoner's structured\
          \ JSON (action_strategy, confidence, reasoning,\n    select_action) -- exactly\
          \ what the model should improve at producing.\n    \"\"\"\n    import boto3,\
          \ json, pathlib, hashlib, random\n\n    s3 = boto3.client(\n        \"s3\"\
          ,\n        endpoint_url          = s3_endpoint,\n        aws_access_key_id\
          \     = s3_access_key,\n        aws_secret_access_key = s3_secret_key,\n\
          \    )\n    out = pathlib.Path(episodes_out.path)\n    train_jsonl = out\
          \ / \"train\" / \"sft_data.jsonl\"\n    val_jsonl   = out / \"val\"   /\
          \ \"sft_data.jsonl\"\n    (out / \"train\").mkdir(parents=True, exist_ok=True)\n\
          \    (out / \"val\").mkdir(parents=True, exist_ok=True)\n\n    paginator\
          \ = s3.get_paginator(\"list_objects_v2\")\n    seen_ids  = set()\n    all_eps\
          \   = []\n\n    for page in paginator.paginate(Bucket=s3_bucket):\n    \
          \    for obj in page.get(\"Contents\", []):\n            key = obj[\"Key\"\
          ]\n            if not key.endswith(\".json\"):\n                continue\n\
          \            body = s3.get_object(Bucket=s3_bucket, Key=key)[\"Body\"].read()\n\
          \            ep   = json.loads(body)\n            eid  = ep.get(\"episode_id\"\
          , hashlib.md5(body).hexdigest()[:12])\n            if eid in seen_ids:\n\
          \                continue\n            seen_ids.add(eid)\n            #\
          \ Only keep episodes that passed curation and have valid reasoning\n   \
          \         if ep.get(\"curation_verdict\") != \"pass\":\n               \
          \ continue\n            all_eps.append((eid, ep))\n\n    random.shuffle(all_eps)\n\
          \    split_idx = int(len(all_eps) * train_split)\n\n    def ep_to_sft_examples(ep:\
          \ dict) -> list[dict]:\n        \"\"\"Convert one episode's valid ticks\
          \ to VLM SFT conversation records.\"\"\"\n        scene_name = ep.get(\"\
          scene\", \"\")\n        scene_desc = ep.get(\"scene_description\", scene_name)\n\
          \        records    = []\n        for tick in ep.get(\"tick_data\", []):\n\
          \            r = tick.get(\"reasoning\", {})\n            if not r.get(\"\
          valid\"):\n                continue\n            # Build target assistant\
          \ output (the reasoning the model produced\n            # and should learn\
          \ to produce more reliably)\n            target = json.dumps({\n       \
          \         \"action_strategy\": r.get(\"action_strategy\", \"\"),\n     \
          \           \"confidence\":      round(float(r.get(\"confidence\", 0.5)),\
          \ 3),\n                \"reasoning\":       r.get(\"reasoning\", \"\"),\n\
          \                \"select_action\":   r.get(\"select_action\", \"good\"\
          ),\n            })\n            records.append({\n                \"conversations\"\
          : [\n                    {\n                        \"from\":  \"human\"\
          ,\n                        \"value\": (\n                            f\"\
          Scene: {scene_desc}\\n\\n\"\n                            \"You are a robot\
          \ arm controller. Examine the scene and \"\n                           \
          \ \"determine the appropriate action strategy. Output \"\n             \
          \               \"structured JSON with keys: action_strategy, confidence\
          \ \"\n                            \"(0.0-1.0), reasoning (1-2 sentences),\
          \ select_action \"\n                            \"('good' or 'bad').\\nRespond\
          \ with JSON only.\"\n                        ),\n                    },\n\
          \                    {\"from\": \"assistant\", \"value\": target},\n   \
          \             ],\n                # frame_path is relative -- the training\
          \ script resolves it from\n                # the dataset root. Include as\
          \ a hint; text-only fallback if absent.\n                \"frame_path\"\
          : ep.get(\"frame_path\", \"\"),\n                \"episode_id\": ep.get(\"\
          episode_id\", \"\"),\n                \"model_version\": ep.get(\"model_version\"\
          , \"\"),\n            })\n        return records\n\n    train_records =\
          \ []\n    val_records   = []\n    for i, (eid, ep) in enumerate(all_eps):\n\
          \        recs = ep_to_sft_examples(ep)\n        if i < split_idx:\n    \
          \        train_records.extend(recs)\n        else:\n            val_records.extend(recs)\n\
          \n    train_jsonl.write_text(\"\\n\".join(json.dumps(r) for r in train_records))\n\
          \    val_jsonl.write_text(  \"\\n\".join(json.dumps(r) for r in val_records))\n\
          \n    print(\n        f\"[ingest] episodes={len(all_eps)} \"\n        f\"\
          train_examples={len(train_records)} val_examples={len(val_records)}\"\n\
          \    )\n    return len(train_records)\n\n"
        image: python:3.12-slim
    exec-open-promotion-pr:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - open_promotion_pr
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'PyGithub==2.4.0'\
          \ && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef open_promotion_pr(\n    image_ref_artifact: dsl.Input[dsl.Artifact],\n\
          \    eval_report:        dsl.Input[dsl.Dataset],   # gate2_report (contains\
          \ gate1 + gate2)\n    model_version:      str,\n    github_repo:       \
          \ str = \"jeremyary/thor-testing\",\n    github_token_path:  str = \"/etc/github/token\"\
          ,\n    gitops_green_file:  str = \"gitops/vllm-cosmos3/deployment-green.yaml\"\
          ,\n) -> str:\n    \"\"\"Open a PR updating deployment-green.yaml's modelcar\
          \ digest and MODEL_VERSION.\n\n    PR body surfaces Gate 1 (reasoning quality)\
          \ + Gate 2 (dream comparison URIs)\n    so reviewers see the full flywheel\
          \ evidence before merging (Gate 3 -- human merge).\n    \"\"\"\n    import\
          \ pathlib, json, base64\n    from github import Github, GithubException\n\
          \n    art_dir   = pathlib.Path(image_ref_artifact.path)\n    meta      =\
          \ json.loads((art_dir / \"image_ref.json\").read_text())\n    image_ref\
          \ = meta[\"image_ref\"]\n    digest    = meta[\"digest\"]\n\n    # eval_report\
          \ is actually the gate2_report which embeds gate1 fields too\n    eval_dir\
          \  = pathlib.Path(eval_report.path)\n    report    = json.loads((eval_dir\
          \ / \"gate2_report.json\").read_text())\n\n    token     = pathlib.Path(github_token_path).read_text().strip()\n\
          \    g         = Github(token)\n    repo      = g.get_repo(github_repo)\n\
          \n    branch_name = f\"promote/{model_version}\"\n    base_sha    = repo.get_branch(\"\
          main\").commit.sha\n\n    # Create branch\n    try:\n        repo.create_git_ref(f\"\
          refs/heads/{branch_name}\", base_sha)\n    except GithubException as e:\n\
          \        if e.status != 422:   # 422 = branch already exists\n         \
          \   raise\n\n    # Read current deployment-green.yaml, update image digest\
          \ + MODEL_VERSION\n    file_content = repo.get_contents(gitops_green_file,\
          \ ref=branch_name)\n    current_yaml = file_content.decoded_content.decode()\n\
          \n    # Regex-replace the two fields we need to update\n    import re\n\
          \    # 1) modelcar initContainer image\n    new_yaml = re.sub(\n       \
          \ r'(image:\\s+)([^\\s]+/thor-builds/cosmos3-edge-modelcar@sha256:[a-f0-9]+)',\n\
          \        lambda m: m.group(1) + image_ref,\n        current_yaml,\n    )\n\
          \    # 2) MODEL_VERSION env var value\n    new_yaml = re.sub(\n        r'(-\
          \ name: MODEL_VERSION\\s+\\n\\s+value:\\s+\")[^\"]+(\")',\n        lambda\
          \ m: m.group(1) + model_version + m.group(2),\n        new_yaml,\n    )\n\
          \n    # Gate 1 fields are embedded in the gate2 report\n    g1_parse   =\
          \ report.get(\"gate1_parse_rate\", 0)\n    g1_sel     = report.get(\"gate1_good_sel_rate\"\
          , 0)\n    v1_uri     = report.get(\"v1_dream_uri\") or \"(not yet generated)\"\
          \n    v2_uri     = report.get(\"v2_dream_uri\") or \"(generated on-Thor\
          \ after merge -- scale dreamer)\"\n\n    pr_body = f\"\"\"## Automated model\
          \ promotion -- {model_version}\n\n**Fine-tuning:** cosmos-framework Reasoner\
          \ SFT on Cosmos3-Edge (Nemotron-2B-Dense-VL)\n**Decision:** D030-A (Reasoner\
          \ SFT chosen; DROID policy post-training deferred to real-arm milestone)\n\
          \n**Gate 1 -- Reasoning quality (val set):**\n\n| Metric | Value |\n|---|---|\n\
          | Reasoning parse rate | `{g1_parse:.1%}` |\n| Good selection rate | `{g1_sel:.1%}`\
          \ |\n\n**Gate 2 -- \"Dream before deploy\" (Forward Dynamics comparison):**\n\
          \n| | Model | Rollout video |\n|---|---|---|\n| Before promotion | `cosmos3-edge-v1`\
          \ | `{v1_uri}` |\n| After promotion | `{model_version}` | `{v2_uri}` |\n\
          \nThe v2 dream video is generated on-Thor after merge by scaling the dreamer\
          \ workload:\n`oc scale deployment dreamer -n flywheel --replicas=1` then\
          \ back to 0 when done.\nCompare the two MP4s: the fine-tuned Reasoner selects\
          \ a physically-plausible action\nchunk more consistently (D030-C, ii-b),\
          \ which is visible as a smoother rollout.\n\n**Modelcar digest:** `{digest}`\n\
          \n**What merging this PR does (Act 3 demo beat):**\n1. Argo syncs `deployment-green.yaml`\
          \ -- green pod starts, CRI-O verifies sigstore signature\n2. Cosmos3-Edge\
          \ Reasoner serves the SFT checkpoint: better embodied reasoning quality\n\
          3. Blue scales to 0; Service selector flips to green -- port 30800 routes\
          \ to new model\n4. Run dreamer (MODEL_VERSION=cosmos3-edge-v2) to produce\
          \ the post-promotion dream video\n5. Show Gate 2 side-by-side: v1 dream\
          \ vs v2 dream -- the flywheel improvement, visualized\n6. Perses: model.version\
          \ step-change panel shows reasoning quality improvement over time\n\n_Opened\
          \ automatically by the cosmos3_finetune_pipeline (NVIDIA/cosmos-framework\
          \ Reasoner SFT)_\n\"\"\"\n\n    repo.update_file(\n        gitops_green_file,\n\
          \        f\"promote: cosmos3-edge {model_version} modelcar digest\",\n \
          \       new_yaml,\n        file_content.sha,\n        branch=branch_name,\n\
          \    )\n    pr = repo.create_pull(\n        title=f\"[promote] cosmos3-edge\
          \ {model_version}\",\n        body=pr_body,\n        head=branch_name,\n\
          \        base=\"main\",\n    )\n    print(f\"[promote] PR opened: {pr.html_url}\"\
          )\n    return pr.html_url\n\n"
        image: bitnami/git:latest
    exec-package-modelcar:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - package_modelcar
        command:
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef package_modelcar(\n    checkpoint:    dsl.Input[dsl.Model],\n\
          \    eval_report:   dsl.Input[dsl.Dataset],\n    registry:      str,\n \
          \   image_name:    str,\n    model_version: str,\n    image_ref_out: dsl.Output[dsl.Artifact]\
          \ = None,\n) -> str:\n    \"\"\"Package the fine-tuned checkpoint as a modelcar\
          \ OCI image (crane append).\n\n    Follows the D017 pattern (crane, not\
          \ buildah) for fast multi-GB pushes.\n    The base is ubi9-micro; the checkpoint\
          \ layer is appended on top.\n    \"\"\"\n    import subprocess, pathlib,\
          \ json, os, tempfile\n\n    checkpoint_dir = pathlib.Path(checkpoint.path)\n\
          \    out_dir        = pathlib.Path(image_ref_out.path)\n    out_dir.mkdir(parents=True,\
          \ exist_ok=True)\n\n    image_ref = f\"{registry}/{image_name}:{model_version}\"\
          \n    print(f\"[package] building modelcar -> {image_ref}\")\n\n    # Create\
          \ a tar of the checkpoint directory to append as a layer\n    with tempfile.NamedTemporaryFile(suffix=\"\
          .tar\", delete=False) as tmp:\n        layer_tar = tmp.name\n\n    subprocess.run([\n\
          \        \"tar\", \"-cf\", layer_tar,\n        \"-C\", str(checkpoint_dir.parent),\n\
          \        checkpoint_dir.name,\n    ], check=True)\n\n    # crane append:\
          \ base=ubi9-micro, one layer = checkpoint tar\n    subprocess.run([\n  \
          \      \"crane\", \"append\",\n        \"--base\", \"registry.access.redhat.com/ubi9/ubi-micro:latest\"\
          ,\n        \"--new_layer\", layer_tar,\n        \"--new_tag\", image_ref,\n\
          \    ], check=True)\n\n    os.unlink(layer_tar)\n\n    # Resolve by digest\
          \ (per D014 convention)\n    result = subprocess.run(\n        [\"crane\"\
          , \"digest\", image_ref],\n        capture_output=True, text=True, check=True,\n\
          \    )\n    digest = result.stdout.strip()\n    image_ref_by_digest = f\"\
          {registry}/{image_name}@{digest}\"\n    print(f\"[package] pushed -> {image_ref_by_digest}\"\
          )\n\n    meta = {\"image_ref\": image_ref_by_digest, \"tag\": image_ref,\
          \ \"digest\": digest}\n    (out_dir / \"image_ref.json\").write_text(json.dumps(meta))\n\
          \    return image_ref_by_digest\n\n"
        image: gcr.io/go-containerregistry/crane:latest
    exec-sign-modelcar:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
