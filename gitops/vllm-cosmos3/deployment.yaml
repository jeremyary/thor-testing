# This project was developed with assistance from AI tools.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmos3-edge
  namespace: vllm
spec:
  replicas: 1
  # Recreate, not RollingUpdate: Thor has exactly one GPU, so a surge pod
  # can never schedule alongside the outgoing one (Insufficient nvidia.com/gpu).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cosmos3-edge
  template:
    metadata:
      labels:
        app: cosmos3-edge
    spec:
      # Thor's CRI-O has no credentials configured for the hub's internal
      # registry at the node level (/etc/crio/openshift-pull-secret only
      # covers registry.redhat.io/quay.io/etc) -- that gap was previously
      # invisible because every image pulled here (vllm-omni, python,
      # nvidia-device-plugin) is public, or (for the modelcar's original
      # manually-built :v1 tag) happened to already be resident in local
      # podman/CRI-O shared storage from being built directly on Thor.
      # Once the modelcar started coming from the hub-side Tekton pipeline
      # (D017), CRI-O had to do a genuine authenticated pull and failed with
      # "authentication required". thor-registry-pull is a manually-created
      # (not GitOps-managed, matches hf-credentials/cosign-signing-key
      # convention) docker-registry Secret backed by a 1-year token for a
      # dedicated thor-edge-puller SA in thor-builds with system:image-puller
      # scoped to that namespace.
      imagePullSecrets:
        - name: thor-registry-pull
      # D014: model weights ship as a signed OCI artifact (modelcar), not an
      # ungoverned HuggingFace runtime download. The modelcar image is a data
      # carrier only (see modelcar/Containerfile) -- this initContainer copies
      # its baked-in HF cache into a shared emptyDir before the main container
      # starts, then HF_HUB_OFFLINE=1 guarantees no network fallback.
      initContainers:
        - name: fetch-model
          # Built by tekton/05-modelcar-pipeline.yaml (crane append, not
          # buildah -- see DECISIONS.md D014), pinned by digest to match this
          # repo's convention of signing/referencing images by digest.
          image: default-route-openshift-image-registry.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com/thor-builds/cosmos3-edge-modelcar@sha256:5c990c93553514cea831fff2c040a879820a55012631648cd2fcdb05943a99ea
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "cp -a /models/huggingface/. /hf-cache/"]
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
      containers:
        - name: cosmos3
          image: docker.io/vllm/vllm-omni:cosmos3
          imagePullPolicy: IfNotPresent
          command: ["bash", "/scripts/entrypoint.sh"]
          ports:
            - containerPort: 8000
          env:
            - name: LD_LIBRARY_PATH
              value: /usr/lib64/nvidia:/usr/lib64:/usr/local/cuda/lib64
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: VLLM_ENABLE_V1_MULTIPROCESSING
              value: "0"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            # NOT HF_HUB_OFFLINE=1: vllm-omni's Cosmos3 DiffusionWorker
            # subprocess re-resolves the tokenizer/VAE subfolders via
            # `os.path.exists(model_path)` on the *unresolved* repo id
            # rather than the snapshot_download()-resolved absolute path,
            # so it falls through to local_files_only=False for that one
            # internal call (see DECISIONS.md D014). Standard HF cache-first
            # resolution still finds everything in the modelcar-sourced
            # cache without hitting the network in practice; HF_TOKEN stays
            # as a narrow fallback for that one framework quirk, not as the
            # primary weight delivery path.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-credentials
                  key: token
          resources:
            limits:
              nvidia.com/gpu: "1"
          securityContext:
            privileged: true
          volumeMounts:
            - name: nvidia-libs
              mountPath: /usr/lib64/nvidia
              readOnly: true
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: nvidia-libs
          hostPath:
            path: /usr/lib64/nvidia
        - name: hf-cache
          emptyDir: {}
        - name: scripts
          configMap:
            name: cosmos3-script
            defaultMode: 0755
