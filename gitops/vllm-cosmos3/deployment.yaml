# This project was developed with assistance from AI tools.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmos3-edge
  namespace: vllm
spec:
  replicas: 1
  # Recreate, not RollingUpdate: Thor has exactly one GPU, so a surge pod
  # can never schedule alongside the outgoing one (Insufficient nvidia.com/gpu).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cosmos3-edge
  template:
    metadata:
      labels:
        app: cosmos3-edge
    spec:
      # D014: model weights ship as a signed OCI artifact (modelcar), not an
      # ungoverned HuggingFace runtime download. The modelcar image is a data
      # carrier only (see modelcar/Containerfile) -- this initContainer copies
      # its baked-in HF cache into a shared emptyDir before the main container
      # starts, then HF_HUB_OFFLINE=1 guarantees no network fallback.
      initContainers:
        - name: fetch-model
          image: default-route-openshift-image-registry.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com/thor-builds/cosmos3-edge-modelcar:v1
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "cp -a /models/huggingface/. /hf-cache/"]
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
      containers:
        - name: cosmos3
          image: docker.io/vllm/vllm-omni:cosmos3
          imagePullPolicy: IfNotPresent
          command: ["bash", "/scripts/entrypoint.sh"]
          ports:
            - containerPort: 8000
          env:
            - name: LD_LIBRARY_PATH
              value: /usr/lib64/nvidia:/usr/lib64:/usr/local/cuda/lib64
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: VLLM_ENABLE_V1_MULTIPROCESSING
              value: "0"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: "1"
          securityContext:
            privileged: true
          volumeMounts:
            - name: nvidia-libs
              mountPath: /usr/lib64/nvidia
              readOnly: true
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: nvidia-libs
          hostPath:
            path: /usr/lib64/nvidia
        - name: hf-cache
          emptyDir: {}
        - name: scripts
          configMap:
            name: cosmos3-script
            defaultMode: 0755
