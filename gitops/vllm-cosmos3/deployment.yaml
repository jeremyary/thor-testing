# This project was developed with assistance from AI tools.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmos3-edge
  namespace: vllm
spec:
  replicas: 1
  # Recreate, not RollingUpdate: Thor has exactly one GPU, so a surge pod
  # can never schedule alongside the outgoing one (Insufficient nvidia.com/gpu).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cosmos3-edge
  template:
    metadata:
      labels:
        app: cosmos3-edge
    spec:
      # Thor's CRI-O has no credentials configured for the hub's internal
      # registry at the node level (/etc/crio/openshift-pull-secret only
      # covers registry.redhat.io/quay.io/etc) -- that gap was previously
      # invisible because every image pulled here (vllm-omni, python,
      # nvidia-device-plugin) is public, or (for the modelcar's original
      # manually-built :v1 tag) happened to already be resident in local
      # podman/CRI-O shared storage from being built directly on Thor.
      # Once the modelcar started coming from the hub-side Tekton pipeline
      # (D017), CRI-O had to do a genuine authenticated pull and failed with
      # "authentication required". thor-registry-pull is a manually-created
      # (not GitOps-managed, matches hf-credentials/cosign-signing-key
      # convention) docker-registry Secret backed by a 1-year token for a
      # dedicated thor-edge-puller SA in thor-builds with system:image-puller
      # scoped to that namespace.
      imagePullSecrets:
        - name: thor-registry-pull
      # D014/D020: model weights ship as a signed OCI artifact (modelcar), not
      # an ungoverned HuggingFace runtime download. The modelcar image is a data
      # carrier only (see modelcar/Containerfile) -- this initContainer copies
      # its baked-in HF cache into a shared emptyDir before the main container
      # starts. The entrypoint pre-resolves the model path (snapshot_download
      # with local_files_only=True) and HF_HUB_OFFLINE=1 guarantees no network
      # fallback. No HF_TOKEN or hf-credentials Secret dependency.
      initContainers:
        - name: fetch-model
          # Built by tekton/05-modelcar-pipeline.yaml (crane append, not
          # buildah -- see DECISIONS.md D014), pinned by digest to match this
          # repo's convention of signing/referencing images by digest.
          image: default-route-openshift-image-registry.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com/thor-builds/cosmos3-edge-modelcar@sha256:5c990c93553514cea831fff2c040a879820a55012631648cd2fcdb05943a99ea
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "cp -a /models/huggingface/. /hf-cache/"]
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
      containers:
        - name: cosmos3
          # D025: bumped from the undocumented `:cosmos3` tag (confirmed via
          # VLLM_ON_THOR.md live investigation to be an unreleased vllm-omni
          # 0.25.0rc2 snapshot) to the official, stable v0.26.0 release, which
          # already contains the Cosmos3 FP8 ModelOpt/Diffusers checkpoint-loading
          # fix (vllm-omni #5076/#5087) relevant to this deployment's --omni
          # diffusion path -- see VLLM_OMNI_UPGRADE_RESEARCH.md for the full
          # research writeup. Pinned by digest per D014 convention (resolved via
          # `crane digest docker.io/vllm/vllm-omni:v0.26.0`, multi-arch manifest
          # list confirmed to include a real arm64 entry, not just amd64).
          # Live-validated on Thor 2026-08-12: manual `oc set image` test (before
          # this GitOps merge) showed a clean Recreate rollout, pod reached 1/1
          # Running in ~40s with no CUDA/driver errors, guardrails initialized,
          # weights loaded (311/311). See VLLM_OMNI_UPGRADE_RESEARCH.md's
          # checklist and DECISIONS.md D025 for what remains to verify after
          # this GitOps sync (actual inference request, FP8 checkpoint itself
          # not yet available so that specific path is still unexercised).
          image: docker.io/vllm/vllm-omni@sha256:5cba1538c6f8ee81e8bea6708c24e68d7b2640f466a9fbf2ef15e68f2168b48b
          imagePullPolicy: IfNotPresent
          command: ["bash", "/scripts/entrypoint.sh"]
          ports:
            - containerPort: 8000
          env:
            - name: LD_LIBRARY_PATH
              value: /usr/lib64/nvidia:/usr/lib64:/usr/local/cuda/lib64
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: VLLM_ENABLE_V1_MULTIPROCESSING
              value: "0"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            # D014/D020: HF_HUB_OFFLINE=1 is now safe because the entrypoint
            # pre-resolves the model repo id to its absolute local snapshot
            # path before passing it to vllm serve. This makes os.path.exists()
            # return True in vllm-omni's DiffusionWorker, so all from_pretrained
            # calls use local_files_only=True. No HF_TOKEN/network fallback needed.
            - name: HF_HUB_OFFLINE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: "1"
          securityContext:
            privileged: true
          volumeMounts:
            - name: nvidia-libs
              mountPath: /usr/lib64/nvidia
              readOnly: true
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: nvidia-libs
          hostPath:
            path: /usr/lib64/nvidia
        - name: hf-cache
          emptyDir: {}
        - name: scripts
          configMap:
            name: cosmos3-script
            defaultMode: 0755
