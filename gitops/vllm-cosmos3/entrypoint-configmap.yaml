# This project was developed with assistance from AI tools.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cosmos3-script
  namespace: vllm
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e
    pip install --upgrade transformers -q 2>&1 | tail -1

    exec python3 -u -c "
    import torch
    torch.zeros(1, device='cuda')
    print('CUDA pre-init OK', flush=True)

    # D014/D020: resolve the HF repo id to its absolute local snapshot path
    # BEFORE passing it to vllm serve. This is necessary because vllm-omni's
    # DiffusionWorker subprocess uses os.path.exists(od_config.model) to decide
    # local_files_only -- with the bare repo id 'nvidia/Cosmos3-Edge' that check
    # returns False, causing it to fall through to local_files_only=False, which
    # breaks under HF_HUB_OFFLINE=1. The framework has _resolve_model_to_local_path
    # (stage_init_utils.py:66) that does exactly this, but it's only called when
    # model_subdir/tokenizer_subdir is set, not in the default path.
    # Resolving here lets us restore HF_HUB_OFFLINE=1 and drop HF_TOKEN entirely.
    from huggingface_hub import snapshot_download
    model_path = snapshot_download('nvidia/Cosmos3-Edge', local_files_only=True)
    print(f'Resolved model path: {model_path}', flush=True)

    import sys
    sys.argv = [
        'vllm', 'serve', model_path, '--omni',
        '--host', '0.0.0.0', '--port', '8000',
        '--enforce-eager', '--gpu-memory-utilization', '0.5',
        '--max-model-len', '4096', '--init-timeout', '1800',
        '--trust-remote-code',
        # Disable the Cosmos3 safety guardrails. vllm-omni requires the
        # 'cosmos-guardrail' pip package (not in this image) to build the
        # CosmosSafetyChecker; without it, guardrails-on (the default) hard-
        # fails orchestrator init with a license-compliance ValueError.
        # NVIDIA's own recipe (recipes/cosmos3/Cosmos3-Edge.md) documents
        # --no-guardrails for self-hosted runs. This maps to
        # model_config["guardrails"]=False in vllm_omni serve.py.
        # TODO(guardrails): revisit for production -- install cosmos-guardrail
        # + gated nvidia/Cosmos-1.0-Guardrail token to re-enable safety checks
        # (we already bundle the guardrail model weights in the modelcar).
        '--no-guardrails',
    ]

    from vllm.scripts import main
    main()
    "
