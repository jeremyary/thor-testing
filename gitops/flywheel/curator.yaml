# This project was developed with assistance from AI tools.
apiVersion: v1
kind: ConfigMap
metadata:
  name: curator-code
  namespace: flywheel
data:
  curator.py: |
    """On-device episode curator — scores episodes on measurable quality signals, passes or drops."""
    import json, os, time, pathlib

    RAW_DIR = pathlib.Path(os.environ.get("RAW_DIR", "/data/episodes/raw"))
    CURATED_DIR = pathlib.Path(os.environ.get("CURATED_DIR", "/data/episodes/curated"))
    REJECTED_DIR = pathlib.Path(os.environ.get("REJECTED_DIR", "/data/episodes/rejected"))
    LATENCY_BUDGET_MS = float(os.environ.get("LATENCY_BUDGET_MS", "8000"))

    def score_episode(episode: dict) -> tuple[float, str]:
        if episode.get("has_failure"):
            return 0.0, "injected-failure"
        if not episode.get("all_within_budget"):
            avg = episode.get("avg_latency_ms", 0)
            if avg > LATENCY_BUDGET_MS:
                return 0.2, f"latency-exceeded ({avg:.0f}ms > {LATENCY_BUDGET_MS:.0f}ms)"
        error_ticks = sum(1 for t in episode.get("tick_data", []) if t.get("action_result", {}).get("error"))
        if error_ticks > 0:
            return 0.1, f"inference-errors ({error_ticks}/{episode.get('ticks', 0)} ticks)"
        return 1.0, "clean"

    if __name__ == "__main__":
        print(f"[curator] Starting — latency budget {LATENCY_BUDGET_MS}ms, watching {RAW_DIR}", flush=True)
        CURATED_DIR.mkdir(parents=True, exist_ok=True)
        REJECTED_DIR.mkdir(parents=True, exist_ok=True)

        while True:
            for path in sorted(RAW_DIR.glob("*.json")):
                try:
                    episode = json.loads(path.read_text())
                    score, reason = score_episode(episode)
                    episode["curation_score"] = round(score, 3)
                    episode["curation_reason"] = reason

                    if score >= 0.5:
                        episode["curation_verdict"] = "pass"
                        dest = CURATED_DIR / path.name
                        dest.write_text(json.dumps(episode, indent=2))
                        print(f"[curator] PASS {episode['episode_id']} score={score:.2f} ({reason})", flush=True)
                    else:
                        episode["curation_verdict"] = "reject"
                        dest = REJECTED_DIR / path.name
                        dest.write_text(json.dumps(episode, indent=2))
                        print(f"[curator] REJECT {episode['episode_id']} score={score:.2f} ({reason})", flush=True)

                    path.unlink()
                except Exception as e:
                    print(f"[curator] Error processing {path.name}: {e}", flush=True)

            time.sleep(3)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curator
  namespace: flywheel
spec:
  replicas: 0
  selector:
    matchLabels:
      app: curator
  template:
    metadata:
      labels:
        app: curator
    spec:
      containers:
        - name: curator
          image: docker.io/library/python:3.12-slim
          command: ["python", "/app/curator.py"]
          env:
            - name: LATENCY_BUDGET_MS
              value: "8000"
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: episodes
              mountPath: /data/episodes
      volumes:
        - name: code
          configMap:
            name: curator-code
        - name: episodes
          hostPath:
            path: /var/lib/episodes
