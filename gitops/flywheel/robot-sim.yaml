# This project was developed with assistance from AI tools.
apiVersion: v1
kind: ConfigMap
metadata:
  name: robot-sim-code
  namespace: flywheel
data:
  robot_sim.py: |
    """Simulated robot control loop — replays scenes at 5 Hz, calls Cosmos3-Edge Reasoner.

    OTel trace shape per episode (all spans properly nested via start_as_current_span):

        episode  [episode.id, model.version, ...]
          control-tick  [tick.number, tick.budget_ms, tick.elapsed_ms, tick.within_budget]
            inference   [inference.latency_ms, inference.status]
              ^ W3C traceparent header injected into the vLLM-Omni HTTP request so
                vLLM's own OTLP spans (queue/prefill/decode) appear as children here.

    OTLP endpoint: uses NODE_IP (downward-API from status.hostIP) + port 4318 so
    the pod reaches the host-level OTel collector systemd service. 127.0.0.1 would
    resolve to the container's own loopback and silently drop all spans.
    """
    import json, os, time, uuid, random, requests, pathlib
    from contextlib import contextmanager

    VLLM_URL    = os.environ.get("VLLM_URL", "http://cosmos3-edge.vllm.svc:8000")
    TICK_HZ     = float(os.environ.get("TICK_HZ", "5"))
    EPISODE_DIR = pathlib.Path(os.environ.get("EPISODE_DIR", "/data/episodes/raw"))
    TICKS_PER_EPISODE = int(os.environ.get("TICKS_PER_EPISODE", "10"))
    FAILURE_RATE      = float(os.environ.get("FAILURE_RATE", "0.3"))
    MODEL_VERSION     = os.environ.get("MODEL_VERSION", "cosmos3-edge-v1")
    OTEL_ENDPOINT     = os.environ.get("OTEL_EXPORTER_OTLP_ENDPOINT", "http://127.0.0.1:4318")
    TICK_BUDGET_MS    = 1000.0 / TICK_HZ

    tracer     = None
    otel_inject = None
    try:
        from opentelemetry import trace
        from opentelemetry.propagate import inject as _inject
        from opentelemetry.sdk.trace import TracerProvider
        from opentelemetry.sdk.trace.export import BatchSpanProcessor
        from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter
        from opentelemetry.sdk.resources import Resource
        resource = Resource.create({
            "service.name":  "robot-sim",
            "model.version": MODEL_VERSION,
        })
        provider = TracerProvider(resource=resource)
        provider.add_span_processor(
            BatchSpanProcessor(OTLPSpanExporter(endpoint=f"{OTEL_ENDPOINT}/v1/traces"))
        )
        trace.set_tracer_provider(provider)
        tracer     = trace.get_tracer("robot-sim")
        otel_inject = _inject
        print(f"[robot-sim] OTel tracing enabled → {OTEL_ENDPOINT}", flush=True)
    except ImportError:
        print("[robot-sim] OTel SDK not available, tracing disabled", flush=True)

    @contextmanager
    def maybe_span(name, **attrs):
        """start_as_current_span if tracing is on; no-op context otherwise.
        Using start_as_current_span (not start_span) is what makes child spans
        nest correctly — it sets the span as the active context for the duration
        of the block, so any nested maybe_span call automatically gets a parent."""
        if tracer:
            with tracer.start_as_current_span(name, attributes=attrs) as span:
                yield span
        else:
            yield None

    SCENES = [
        "A mobile robot approaches a warehouse shelf with packages to pick.",
        "A robotic arm is positioned above a conveyor belt with mixed objects.",
        "A humanoid robot stands in front of a closed door in a hallway.",
        "A delivery robot navigates a sidewalk approaching a crosswalk.",
        "A robotic gripper hovers over a bin of unsorted components.",
    ]

    def call_reasoner(scene: str) -> dict:
        """Call vLLM-Omni. Must be called while a parent span is current (inside
        a maybe_span block) so the inference span nests correctly in Tempo."""
        # Inject W3C traceparent from the *current* active span (control-tick)
        # into the HTTP headers. vLLM-Omni's OTLP tracing will then appear as
        # a child of our control-tick span in Tempo waterfall view.
        http_headers = {}
        if otel_inject:
            otel_inject(http_headers)

        with maybe_span("inference",
                        **{"inference.model": "nvidia/Cosmos3-Edge",
                           "inference.endpoint": VLLM_URL}) as inf_span:
            t0 = time.monotonic()
            try:
                resp = requests.post(
                    f"{VLLM_URL}/v1/chat/completions",
                    headers=http_headers,
                    json={
                        "model": "nvidia/Cosmos3-Edge",
                        "messages": [
                            {"role": "system", "content": "You are a robot action planner. Given a scene, output a short action plan as JSON with keys: action, confidence, reasoning."},
                            {"role": "user",   "content": f"Scene: {scene}"},
                        ],
                        "max_tokens": 150,
                        "temperature": 0.7,
                    },
                    timeout=30,
                )
                resp.raise_for_status()
                latency = resp.elapsed.total_seconds() * 1000
                content = resp.json()["choices"][0]["message"]["content"]
                if inf_span:
                    inf_span.set_attribute("inference.latency_ms", round(latency, 1))
                    inf_span.set_attribute("inference.status", "ok")
                return {"raw_response": content, "latency_ms": latency}
            except Exception as e:
                elapsed_ms = round((time.monotonic() - t0) * 1000, 1)
                if inf_span:
                    inf_span.set_attribute("inference.error", str(e))
                    inf_span.set_attribute("inference.status", "error")
                    inf_span.set_attribute("inference.latency_ms", elapsed_ms)
                return {"raw_response": "", "error": str(e), "latency_ms": elapsed_ms}

    def run_episode() -> dict:
        episode_id    = str(uuid.uuid4())[:12]
        scene         = random.choice(SCENES)
        inject_failure = random.random() < FAILURE_RATE
        budget_s      = 1.0 / TICK_HZ
        ticks         = []

        with maybe_span("episode",
                        **{"episode.id":       episode_id,
                           "episode.scene":    scene,
                           "model.version":    MODEL_VERSION}) as episode_span:

            for tick_num in range(TICKS_PER_EPISODE):
                tick_t0 = time.monotonic()
                is_last = tick_num == TICKS_PER_EPISODE - 1
                fail_this_tick = inject_failure and is_last

                with maybe_span("control-tick",
                                **{"tick.number":     tick_num,
                                   "tick.budget_ms":  round(TICK_BUDGET_MS, 1),
                                   "tick.injected_failure": fail_this_tick}) as tick_span:
                    result  = call_reasoner(scene)
                    elapsed = time.monotonic() - tick_t0
                    within_budget = elapsed <= budget_s
                    if tick_span:
                        tick_span.set_attribute("tick.elapsed_ms",    round(elapsed * 1000, 1))
                        tick_span.set_attribute("tick.within_budget",  within_budget)

                ticks.append({
                    "tick":             tick_num,
                    "scene":            scene,
                    "action_result":    result,
                    "elapsed_s":        round(elapsed, 4),
                    "within_budget":    within_budget,
                    "injected_failure": fail_this_tick,
                })
                sleep_remaining = max(0, budget_s - (time.monotonic() - tick_t0))
                time.sleep(sleep_remaining)

            episode = {
                "episode_id":       episode_id,
                "timestamp":        time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                "scene":            scene,
                "ticks":            len(ticks),
                "avg_latency_ms":   round(
                    sum(t["action_result"].get("latency_ms", 0) for t in ticks) / len(ticks), 1
                ),
                "all_within_budget": all(t["within_budget"] for t in ticks),
                "has_failure":       any(t["injected_failure"] for t in ticks),
                "model_version":     MODEL_VERSION,
                "tick_data":         ticks,
            }

            if episode_span:
                episode_span.set_attribute("episode.ticks",            len(ticks))
                episode_span.set_attribute("episode.avg_latency_ms",   episode["avg_latency_ms"])
                episode_span.set_attribute("episode.all_within_budget", episode["all_within_budget"])
                episode_span.set_attribute("episode.has_failure",       episode["has_failure"])

        EPISODE_DIR.mkdir(parents=True, exist_ok=True)
        path = EPISODE_DIR / f"{episode_id}.json"
        path.write_text(json.dumps(episode, indent=2))
        print(
            f"[robot-sim] Episode {episode_id}: {len(ticks)} ticks, "
            f"avg {episode['avg_latency_ms']:.0f}ms, failure={episode['has_failure']}",
            flush=True,
        )
        return episode

    if __name__ == "__main__":
        print(
            f"[robot-sim] Starting — {TICK_HZ} Hz, {TICKS_PER_EPISODE} ticks/episode, "
            f"{FAILURE_RATE:.0%} failure rate, model={MODEL_VERSION}",
            flush=True,
        )
        cooldown = float(os.environ.get("EPISODE_COOLDOWN_S", "5"))
        while True:
            try:
                run_episode()
            except Exception as e:
                print(f"[robot-sim] Episode failed: {e}", flush=True)
            time.sleep(cooldown)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-sim
  namespace: flywheel
spec:
  replicas: 0
  selector:
    matchLabels:
      app: robot-sim
  template:
    metadata:
      labels:
        app: robot-sim
    spec:
      containers:
        - name: robot-sim
          image: docker.io/library/python:3.12-slim
          command: ["sh", "-c", "pip install -q requests opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http && python /app/robot_sim.py"]
          env:
            - name: VLLM_URL
              value: "http://cosmos3-edge.vllm.svc:8000"
            - name: TICK_HZ
              value: "1"
            - name: TICKS_PER_EPISODE
              value: "5"
            - name: FAILURE_RATE
              value: "0.3"
            - name: EPISODE_COOLDOWN_S
              value: "10"
            # MODEL_VERSION stamps every OTel trace and every episode JSON.
            # Keep in sync with the active cosmos3-edge Deployment's MODEL_VERSION env.
            - name: MODEL_VERSION
              value: "cosmos3-edge-v1"
            # NODE_IP (downward API) is the host's IP as seen by the pod.
            # The OTel collector runs as a systemd service on the host at :4318;
            # 127.0.0.1 would be the container's own loopback and silently drop spans.
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(NODE_IP):4318"
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: episodes
              mountPath: /data/episodes
      volumes:
        - name: code
          configMap:
            name: robot-sim-code
        - name: episodes
          hostPath:
            path: /var/lib/episodes
