    <script>
    // ---- Theme toggle --------------------------------------------------------
    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('flywheel-theme', t);
      document.getElementById('theme-light').classList.toggle('active', t === 'light');
      document.getElementById('theme-dark').classList.toggle('active', t === 'dark');
    }
    // Apply saved theme immediately (before paint)
    (function() {
      const saved = localStorage.getItem('flywheel-theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      // Button highlight applied after DOM ready below
    })();
    // Set button state once DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      const t = localStorage.getItem('flywheel-theme') || 'light';
      document.getElementById('theme-light').classList.toggle('active', t === 'light');
      document.getElementById('theme-dark').classList.toggle('active', t === 'dark');
    });

    // ---- State ---------------------------------------------------------------
    // annotations always visible (toggle removed)
    let logAnnotationsOn = true;
    let autoScroll      = true;
    let logEntries      = [];
    const MAX_LOG       = 30;

    // ---- SSE ----------------------------------------------------------------
    const evtSource = new EventSource('/api/events');

    evtSource.addEventListener('status', e => {
      const s = JSON.parse(e.data);
      applyStatus(s);
    });

    // The curation log is driven authoritatively by the 'status' event's
    // s.log list (rebuilt via renderLog in applyStatus), which is reliable
    // under the fast curated->sent file moves. The legacy per-episode SSE
    // events remain as an optional early hint but are no longer the source
    // of truth.
    evtSource.addEventListener('episode', e => {
      const ep = JSON.parse(e.data);
      prependLogEntry(ep);   // best-effort immediate feedback; reconciled by renderLog
    });

    evtSource.addEventListener('log_init', e => {
      const eps = JSON.parse(e.data);
      eps.forEach(ep => {
        ep.verdict = ep._verdict || ep.verdict || 'pass';
        if (ep.ts == null) ep.ts = ep._mtime || 0;   // normalize for renderLog's sort
      });
      renderLog(eps);   // initial paint; renderLog sorts newest-first by ts
    });

    evtSource.addEventListener('dream', e => {
      // A live dreamer run (manual oc-scale path) produced a new file. Don't
      // auto-play -- just make it the file the Play button will use, and tell
      // the user it's ready to play.
      const d = JSON.parse(e.data);
      window._dreamFiles = window._dreamFiles || {};
      window._dreamFiles[d.version] = d.file;
      dreamLoaded[d.version] = null;   // force reload of the new file on next Play
      showToast('Rollout ' + d.version + ' ready \u2014 press Play ' + d.version,
                d.version === 'v2' ? 'toast-green' : 'toast-blue');
    });

    evtSource.addEventListener('clear', e => {
      // Reset dream videos
      for (const ver of ['v1', 'v2']) {
        const vid  = document.getElementById('dream-' + ver);
        const ph   = document.getElementById('dream-ph-' + ver);
        const wrap = document.getElementById('dream-wrap-' + ver);
        vid.pause();
        vid.removeAttribute('src');
        vid.classList.remove('loaded');
        ph.classList.remove('hidden');
        wrap.classList.remove('has-video');
        dreamLoaded[ver] = null;
        setDreamButton(ver, false);
      }
      // Reset log
      document.getElementById('log-body').innerHTML =
        '<div id="log-empty">Cleared \u2014 episodes will appear here when flywheel runs</div>';
      // Reset generator panel
      document.getElementById('gen-empty').style.display = '';
      document.getElementById('gen-fields').style.display = 'none';
      showToast('Data cleared', '');
    });

    evtSource.onerror = () => {
      document.getElementById('sb-fw').textContent = 'reconnecting...';
    };

    // ---- Apply status -------------------------------------------------------
    function applyStatus(s) {
      // Model version
      const mv = s.model_version || 'cosmos3-edge-v1';
      const isV2 = mv === 'cosmos3-edge-v2';
      document.getElementById('model-label').textContent = mv;
      document.getElementById('model-badge').className = isV2 ? 'v2' : 'v1';
      document.getElementById('sb-model').textContent = mv;

      // Flywheel running
      const fw = s.flywheel_running;
      document.getElementById('btn-start').classList.toggle('hidden', fw);
      document.getElementById('btn-stop').classList.toggle('hidden', !fw);
      document.getElementById('flywheel-status').classList.toggle('hidden', !fw);
      document.getElementById('sb-fw').textContent = fw ? 'running' : 'idle';

      // Dreamer
      const dr = s.dreamer_running;
      document.getElementById('dream-dreamer-status').classList.toggle('hidden', !dr);
      document.getElementById('btn-dream-stop').classList.toggle('hidden', !dr);
      document.getElementById('btn-dream-v1').disabled = dr;
      document.getElementById('btn-dream-v2').disabled = dr;

      // Progress
      const t = s.trigger;
      const pct = t.pct || 0;
      document.getElementById('prog-fill').style.width = pct + '%';
      document.getElementById('prog-fill').classList.toggle('triggered', t.triggered);
      document.getElementById('prog-text').textContent =
        t.progress + ' / ' + t.threshold + ' curated episodes sent to hub';
      document.getElementById('prog-state').textContent =
        t.triggered ? 'TRIGGERED' : (fw ? 'collecting' : 'idle');
      document.getElementById('trigger-banner').classList.toggle('show', t.triggered);

      // Counts
      const c = s.counts || {};
      document.getElementById('c-total').textContent   = (c.raw||0)+(c.curated||0)+(c.rejected||0)+(c.sent||0);
      document.getElementById('c-curated').textContent  = c.curated  || 0;
      document.getElementById('c-rejected').textContent = c.rejected || 0;
      document.getElementById('c-sent').textContent     = c.sent     || 0;

      // Latest scene
      const lat = s.latest || {};
      if (lat.scene) {
        const sceneKey = lat.frame || (lat.scene + '.jpg');
        const img = document.getElementById('scene-img');
        const ph  = document.getElementById('scene-img-placeholder');
        img.src = '/api/frame/' + sceneKey + '?t=' + Date.now();
        img.style.display = 'block';
        ph.style.display  = 'none';
        document.getElementById('scene-name').textContent = lat.scene.replace(/_/g,' ');
        document.getElementById('scene-tag').textContent  = lat.scene;
        if (lat.scene_description) {
          document.getElementById('scene-prompt').textContent = '"' + lat.scene_description + '"';
        }
      }

      // Generator output -- only update DOM when the episode actually changes
      // (prevents blinking on the 3-second status poll when flywheel is stopped)
      const genKey = JSON.stringify(lat.generation) + JSON.stringify(lat.policy) + (lat.curation_score||'');
      if ((lat.generation || lat.policy) && genKey !== window._lastGenKey) {
        window._lastGenKey = genKey;
        document.getElementById('gen-empty').style.display = 'none';
        document.getElementById('gen-fields').style.display = 'block';

        // Generated video clip
        const gen = lat.generation || {};
        const genOk = gen.status === 'ok';
        if (genOk) {
          const genVid = document.getElementById('gen-vid');
          const genImg = document.getElementById('gen-img');
          const genPh  = document.getElementById('gen-img-placeholder');
          const src = '/api/generated-image?t=' + Date.now();
          const isVideo = (gen.type === 'i2v');
          if (isVideo && genVid) {
            genVid.src = src;
            genVid.style.display = 'block';
            genVid.load();
            if (genImg) genImg.style.display = 'none';
          } else if (genImg) {
            genImg.src = src;
            genImg.style.display = 'block';
            if (genVid) genVid.style.display = 'none';
          }
          genPh.style.display = 'none';
        }
        document.getElementById('g-t2i-status').innerHTML =
          `<span class="sel-badge ${genOk ? 'sel-good' : 'sel-bad'}">${genOk ? '&#10003;' : '&#10007;'} ${gen.status || '--'}</span>`;
        document.getElementById('g-t2i-size').textContent =
          gen.image_size ? (gen.image_size > 1024 ? (gen.image_size/1024).toFixed(0) + ' KB' : gen.image_size + ' B') : '--';
        document.getElementById('g-t2i-latency').textContent =
          gen.latency_ms ? gen.latency_ms.toFixed(0) + ' ms' : '--';

        // Action Policy
        const pol = lat.policy || {};
        const polOk = pol.status === 'ok';
        document.getElementById('g-policy-status').innerHTML =
          `<span class="sel-badge ${polOk ? 'sel-good' : pol.status === 'fallback' ? 'sel-bad' : 'sel-bad'}">${polOk ? '&#10003;' : '&#10007;'} ${pol.status || '--'}</span>`;
        document.getElementById('g-policy-chunk').textContent =
          pol.chunk_size ? pol.chunk_size + ' steps x ' + (pol.domain_name || '?') : '--';
        document.getElementById('g-policy-latency').textContent =
          pol.latency_ms ? pol.latency_ms.toFixed(0) + ' ms' : '--';

        // Smoothness
        const sm = pol.smoothness || 0;
        const cls = sm < 0.8 ? 'smooth-good' : sm < 1.0 ? 'smooth-warn' : 'smooth-bad';
        const lbl = sm < 0.8 ? 'plausible' : sm < 1.0 ? 'marginal' : 'jerky';
        document.getElementById('g-policy-smooth').innerHTML =
          `<span class="smooth-pill ${cls}">&#9679; ${sm.toFixed(4)} &mdash; ${lbl}</span>`;

        // Curation
        const score = lat.curation_score;
        const verdict = lat.curation_verdict;
        if (score != null) {
          const sc = scoreClass(score);
          document.getElementById('g-curation').innerHTML =
            `<span class="sel-badge ${verdict === 'pass' ? 'sel-good' : 'sel-bad'}">${verdict === 'pass' ? '&#10003; PASS' : '&#10007; REJECT'}</span> <span class="${sc}">${score.toFixed(3)}</span>`;
        }
      }

      // Dreams: intentionally NOT auto-loaded here. The Play v1/v2 buttons
      // are the trigger (playPinnedDream) so the rollouts stay on a placeholder
      // until the user explicitly presses Play. We only stash the available
      // filenames for the buttons to use.
      window._dreamFiles = s.dreams || {};

      // Curation log (authoritative rebuild from the status snapshot)
      if (s.log) renderLog(s.log);

      // Timestamp
      document.getElementById('sb-ts').textContent =
        new Date().toLocaleTimeString();
    }

    // ---- Dream loader -------------------------------------------------------
    const dreamLoaded = {v1: null, v2: null};

    // Play<->Stop toggle button state. v1 is blue, v2 is gold when idle;
    // both turn red ("Stop") while their rollout is playing.
    function setDreamButton(ver, playing) {
      const btn  = document.getElementById('btn-dream-' + ver);
      if (!btn) return;
      const idleCls = ver === 'v2' ? 'btn-gold' : 'btn-blue';
      btn.classList.remove('btn-blue', 'btn-gold', 'btn-red');
      if (playing) {
        btn.classList.add('btn-red');
        btn.innerHTML = '\u25A0 Stop ' + ver;
      } else {
        btn.classList.add(idleCls);
        btn.innerHTML = '\u25B6 Play ' + ver;
      }
    }

    // Attach play/pause listeners once so the button always reflects the real
    // <video> state (covers loop, programmatic pause, Clear, etc.).
    function wireDreamVideo(ver) {
      const vid = document.getElementById('dream-' + ver);
      if (vid._wired) return;
      vid._wired = true;
      vid.addEventListener('play',  () => setDreamButton(ver, true));
      vid.addEventListener('pause', () => setDreamButton(ver, false));
    }

    // Toggle: play from the start if stopped, otherwise stop.
    function toggleDream(ver) {
      const vid = document.getElementById('dream-' + ver);
      if (vid && !vid.paused && vid.classList.contains('loaded')) {
        vid.pause();                 // -> 'pause' event flips button to Play
      } else {
        playPinnedDream(ver);        // load (if needed) + play from frame 0
      }
    }

    function loadDream(ver, file, autoPlay) {
      const vid  = document.getElementById('dream-' + ver);
      const ph   = document.getElementById('dream-ph-' + ver);
      const wrap = document.getElementById('dream-wrap-' + ver);
      wireDreamVideo(ver);
      // Reload only if the source changed; otherwise just replay from start.
      if (dreamLoaded[ver] !== file) {
        dreamLoaded[ver] = file;
        vid.src = '/api/dream/' + file + '?t=' + Date.now();
        vid.load();
        vid.onloadeddata = () => {
          vid.classList.add('loaded');
          ph.classList.add('hidden');
          wrap.classList.add('has-video');
          if (ver === 'v2') {
            document.getElementById('dream-smooth-v2').textContent = 'Post fine-tuning rollout';
          }
          if (autoPlay) { vid.currentTime = 0; vid.play(); }
        };
      } else if (autoPlay) {
        // Already loaded -- restart playback from the first frame.
        vid.classList.add('loaded');
        ph.classList.add('hidden');
        wrap.classList.add('has-video');
        vid.currentTime = 0;
        vid.play();
      }
    }

    // ---- Pinned showcase rollout playback -----------------------------------
    // The Play v1/v2 buttons play the pinned, curated comparison pair
    // (zzz-showcase-cosmos3-edge-v{1,2}.mp4 on Thor's /var/lib/dreams,
    // immutable) via the same _dreams() [-1] pick the status snapshot uses.
    // Deterministic: no live GPU dreamer run, same rollout every demo.
    // Videos do NOT autoplay -- pressing Play is the explicit trigger.
    async function playPinnedDream(ver) {
      const btnId = ver === 'v2' ? 'btn-dream-v2' : 'btn-dream-v1';
      setLoading(btnId, true);
      try {
        // Prefer the filenames stashed by the status stream; fall back to a fetch.
        let file = (window._dreamFiles || {})[ver];
        if (!file) {
          const r = await fetch('/api/status');
          const s = await r.json();
          window._dreamFiles = s.dreams || {};
          file = window._dreamFiles[ver];
        }
        if (file) {
          loadDream(ver, file, true);   // true = play from first frame on load
          showToast('Playing ' + ver + ' \u2014 Forward Dynamics rollout',
                    ver === 'v2' ? 'toast-green' : 'toast-blue');
        } else {
          showToast('No ' + ver + ' rollout available', '');
        }
      } finally {
        setLoading(btnId, false);
      }
    }

    // ---- Curation log -------------------------------------------------------
    const logBody = document.getElementById('log-body');

    logBody.addEventListener('scroll', () => {
      const b = logBody;
      autoScroll = b.scrollTop + b.clientHeight >= b.scrollHeight - 10;
    });

    function scoreClass(score) {
      if (score >= 0.6) return 'score-good';
      if (score >= 0.3) return 'score-mid';
      return 'score-bad';
    }

    function reasonAnnotation(ep) {
      const verdict = ep.verdict || ep._verdict || 'pass';
      if (verdict === 'reject') {
        const r = ep.curation_reason || '';
        if (r.includes('injected'))
          return 'Planted bad data \u2014 curator caught it, stays on Thor, never reaches hub';
        if (r.includes('gen-failed'))
          return 'Text\u2192Image generation failed \u2014 Generator could not produce coherent output';
        if (r.includes('gen-tiny'))
          return 'Generated image too small \u2014 likely degenerate output, rejected';
        if (r.includes('policy-failed'))
          return 'Action Policy prediction failed \u2014 no valid trajectory produced';
        if (r.includes('jerky'))
          return 'Predicted action trajectory is jerky \u2014 physically implausible, rejected';
        return 'Curation score below threshold \u2014 ' + r;
      }
      const gen = ep.generation || {};
      const pol = ep.policy || {};
      const s = ep.avg_smoothness || pol.smoothness || 0;
      return `I2V: ${gen.status || '?'} (${((gen.image_size||0)/1024).toFixed(0)}KB), Policy: ${pol.status || '?'} (smoothness ${s.toFixed(3)})`;
    }

    // Authoritative log renderer: rebuilds the scrollable list from the
    // status snapshot's episode list (newest first). Only re-renders when the
    // set of episode ids actually changes, so it won't clobber a user's
    // click-to-expand state on every 3s tick.
    let _logSig = null;
    function renderLog(entries) {
      if (!Array.isArray(entries)) return;
      // newest first (backend sorts newest-first already; keep defensive)
      const list = [...entries].sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, MAX_LOG);
      const sig = list.map(e => e.episode_id).join('|');
      if (sig === _logSig) return;   // nothing changed
      _logSig = sig;

      const body = document.getElementById('log-body');
      if (!list.length) {
        body.innerHTML = '<div id="log-empty" style="color:var(--txt3);text-align:center;padding:12px 0;font-size:11px">Episodes will appear here once the flywheel starts</div>';
        return;
      }
      body.innerHTML = '';
      for (const ep of list) body.appendChild(buildLogEntry(ep));
      if (autoScroll) body.scrollTop = 0;
    }

    // Build a single log-entry node (shared by renderLog + prependLogEntry).
    function buildLogEntry(ep) {
      const verdict = ep.verdict || ep._verdict || 'pass';
      const score   = ep.curation_score || 0;
      const ts      = ep.ts ? new Date(ep.ts * 1000).toLocaleTimeString() : '--';
      const div = document.createElement('div');
      div.className = 'log-entry ' + verdict;
      div.innerHTML = `
        <div class="log-main">
          <span class="log-time">${ts}</span>
          <span class="log-verdict ${verdict}">${verdict === 'pass' ? '&#10003; PASS' : '&#10007; REJECT'}</span>
          <span class="log-id">${(ep.episode_id||'').substring(0,8)}</span>
          <span class="log-score ${scoreClass(score)}">${score.toFixed(3)}</span>
          <span class="log-scene">${(ep.scene||'').replace(/_/g,' ')}</span>
        </div>
        <div class="log-reason ${logAnnotationsOn ? 'show' : ''}">${reasonAnnotation(ep)}</div>`;
      div.style.cursor = 'pointer';
      div.addEventListener('click', () => {
        div.querySelector('.log-reason').classList.toggle('show');
      });
      return div;
    }

    function prependLogEntry(ep) {
      document.getElementById('log-empty').style.display = 'none';
      const verdict = ep.verdict || ep._verdict || 'pass';
      const score   = ep.curation_score || 0;
      const ts      = ep.ts ? new Date(ep.ts * 1000).toLocaleTimeString() : '--';

      const div = document.createElement('div');
      div.className = 'log-entry ' + verdict;
      div.innerHTML = `
        <div class="log-main">
          <span class="log-time">${ts}</span>
          <span class="log-verdict ${verdict}">${verdict === 'pass' ? '&#10003; PASS' : '&#10007; REJECT'}</span>
          <span class="log-id">${(ep.episode_id||'').substring(0,8)}</span>
          <span class="log-score ${scoreClass(score)}">${score.toFixed(3)}</span>
          <span class="log-scene">${(ep.scene||'').replace(/_/g,' ')}</span>
        </div>
        <div class="log-reason ${logAnnotationsOn ? 'show' : ''}">${reasonAnnotation(ep)}</div>
      `;
      div.style.cursor = 'pointer';
      div.addEventListener('click', () => {
        div.querySelector('.log-reason').classList.toggle('show');
      });

      logBody.prepend(div);

      // Trim
      while (logBody.children.length > MAX_LOG + 1) {
        logBody.removeChild(logBody.lastChild);
      }

      if (autoScroll) {
        logBody.scrollTop = 0;
      }
    }

    // ---- Controls -----------------------------------------------------------
    function setLoading(btnId, loading) {
      const b = document.getElementById(btnId);
      if (b) b.disabled = loading;
    }

    async function controlFlywheel(action) {
      const btn = action === 'start' ? 'btn-start' : 'btn-stop';
      setLoading(btn, true);
      try {
        const r = await fetch('/api/control/flywheel', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action})
        });
        const d = await r.json();
        showToast(action === 'start' ? 'Flywheel started' : 'Flywheel stopped',
                  action === 'start' ? 'toast-green' : '');
      } finally {
        setLoading(btn, false);
      }
    }

    async function controlDreamer(action, model_version) {
      const btnId = action === 'start'
        ? (model_version === 'cosmos3-edge-v2' ? 'btn-dream-v2' : 'btn-dream-v1')
        : 'btn-dream-stop';
      setLoading(btnId, true);
      try {
        const r = await fetch('/api/control/dreamer', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({action, model_version})
        });
        const d = await r.json();
        if (action === 'start') {
          const ver = model_version === 'cosmos3-edge-v2' ? 'v2' : 'v1';
          showToast('Dreamer started \u2014 generating ' + ver + ' Forward Dynamics rollout\u2026',
                    ver === 'v2' ? 'toast-gold' : 'toast-blue');
        }
      } finally {
        setLoading(btnId, false);
      }
    }

    async function controlClear() {
      if (!confirm('Clear all episode data on Thor? This cannot be undone.')) return;
      setLoading('btn-clear', true);
      try {
        const r = await fetch('/api/control/clear', {method: 'POST'});
        const d = await r.json();
        document.getElementById('log-body').innerHTML =
          '<div id="log-empty">Cleared \u2014 episodes will appear here when flywheel runs</div>';
        logEntries = [];
        showToast('Cleared ' + d.cleared + ' episode files', '');
      } finally {
        setLoading('btn-clear', false);
      }
    }

    // ---- Toast --------------------------------------------------------------
    let toastTimer = null;
    function showToast(msg, cls) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show ' + (cls || '');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        t.className = '';
      }, 4000);
    }
    </script>
    </body>
    </html>

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: flywheel
  annotations:
    # hostPath volumes require hostmount-anyuid SCC on MicroShift.
    # Applied via: oc adm policy add-scc-to-user hostmount-anyuid -z dashboard -n flywheel
    # Same pattern as robot-sim, curator, dreamer (scc-rolebinding.yaml).
    openshift.io/scc-note: "hostmount-anyuid required for episode/dream/frame hostPath mounts"
---
# Flywheel namespace: read + scale Deployments (for controls)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-flywheel
  namespace: flywheel
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-flywheel
  namespace: flywheel
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: flywheel
roleRef:
  kind: Role
  name: dashboard-flywheel
  apiGroup: rbac.authorization.k8s.io
---
# vllm namespace: read Service selector to detect active model version
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-vllm-reader
  namespace: vllm
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-vllm-reader
  namespace: vllm
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: flywheel
roleRef:
  kind: Role
  name: dashboard-vllm-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: flywheel
  labels:
    app: dashboard
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      serviceAccountName: dashboard
      containers:
        - name: dashboard
          image: docker.io/library/python:3.12-slim
          command:
            - sh
            - -c
            - pip install -q flask kubernetes && python /app/dashboard.py
          ports:
            - containerPort: 8080
          env:
            - name: FLYWHEEL_NS
              value: "flywheel"
            - name: VLLM_NS
              value: "vllm"
            - name: TRIGGER_THRESHOLD
              value: "10"
            - name: FRAMES_DIR
              value: "/data/frames"
            - name: HTML_FILE
              value: "/app/index.html"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: episodes
              mountPath: /data/episodes
              # writable so the Clear Data button can delete episode files
            - name: dreams
              mountPath: /data/dreams
              # writable so Clear Data can also remove dream videos
            - name: frames
              mountPath: /data/frames
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: dashboard-code
        - name: episodes
          hostPath:
            path: /var/lib/episodes
        - name: dreams
          hostPath:
            path: /var/lib/dreams
        - name: frames
          hostPath:
            path: /var/lib/robot-sim/frames
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: flywheel
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30801
