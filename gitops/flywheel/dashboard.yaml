    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.toast-green { border-color: var(--green); color: #065f44; background: var(--green-dim); }
    #toast.toast-blue  { border-color: var(--blue);  color: #003d7a; background: var(--blue-dim);  }
    #toast.toast-gold  { border-color: var(--gold);  color: #6b4c08; background: #f5e6c0;  }

    /* ---- Misc ----------------------------------------------------------- */
