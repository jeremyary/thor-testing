# This project was developed with assistance from AI tools.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mm2-config
  namespace: flywheel
data:
  mm2.properties: |
    # Cluster aliases
    clusters=edge,hub

    # Edge Kafka (local, plaintext)
    edge.bootstrap.servers=edge-kafka.flywheel.svc:9092

    # Hub Kafka (external route, TLS, server-auth only)
    hub.bootstrap.servers=fleet-kafka-bootstrap-fleet-ops.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com:443
    hub.security.protocol=SSL
    hub.ssl.endpoint.identification.algorithm=
    hub.ssl.truststore.type=PEM
    hub.ssl.truststore.location=/certs/ca.crt
    # Generous timeouts for cross-network TLS connection to hub
    hub.admin.timeout.ms=60000
    hub.request.timeout.ms=60000
    hub.connections.max.idle.ms=540000
    hub.default.api.timeout.ms=120000
    hub.metadata.max.age.ms=300000

    # Replication: edge -> hub only.
    # All hub->edge sub-features must be explicitly disabled to prevent MM2
    # from creating a reverse-direction herder that tries to coordinate on
    # the hub Kafka (which fails because it can't create internal topics
    # on the external TLS route).
    edge->hub.enabled=true
    hub->edge.enabled=false
    hub->edge.emit.heartbeats.enabled=false
    hub->edge.emit.checkpoints.enabled=false
    hub->edge.sync.group.offsets.enabled=false
    hub->edge.sync.topic.configs.enabled=false
    hub->edge.sync.topic.acls.enabled=false

    # Topics to replicate
    edge->hub.topics=episode-manifests

    # Don't rename topics
    replication.policy.class=org.apache.kafka.connect.mirror.IdentityReplicationPolicy

    # Replication config
    offset-syncs.topic.replication.factor=1
    heartbeats.topic.replication.factor=1
    checkpoints.topic.replication.factor=1

    # Consumer/producer tuning
    tasks.max=1
    replication.factor=1
    sync.topic.configs.enabled=false
    sync.topic.acls.enabled=false
    refresh.topics.interval.seconds=60
    refresh.groups.interval.seconds=60
    emit.heartbeats.interval.seconds=60

    # Speed up Connect plugin loading (avoid 30s reflection scan)
    plugin.discovery=service_load
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirrormaker2
  namespace: flywheel
spec:
  replicas: 0
  selector:
    matchLabels:
      app: mirrormaker2
  template:
    metadata:
      labels:
        app: mirrormaker2
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: mm2
          image: quay.io/strimzi/kafka:0.45.0-kafka-3.9.0
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - exec bin/connect-mirror-maker.sh /etc/mm2/mm2.properties
          volumeMounts:
            - name: config
              mountPath: /etc/mm2
              readOnly: true
            - name: hub-ca
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: mm2-config
        - name: hub-ca
          secret:
            secretName: hub-kafka-ca
