# This project was developed with assistance from AI tools.
#
# containers-registries.d config enabling cosign/sigstore signature lookups
# for the internal OpenShift registry -- companion to policy.json, which
# declares sigstoreSigned as the required policy for this registry but
# (on its own) is not sufficient to make that enforcement functional.
#
# policy.json says WHAT to require; registries.d says WHERE/WHETHER to look
# for the signature at all. Without `use-sigstore-attachments: true` here,
# containers/image treats every image from this registry as if it has no
# attachments, and pulls fail with "A signature was required, but no
# signature exists" even when a valid cosign signature is present and
# independently verifiable -- discovered 2026-08-10 while validating the
# Tekton-built modelcar image; confirmed via `skopeo copy --debug` (logs
# "Not looking for sigstore attachments: disabled by configuration") and
# reproduced identically against the already-shipping OS image (thor-edge),
# proving this was a pre-existing gap since the very first bootc image, not
# specific to the modelcar or its build tooling (buildah vs crane, D017).
# It was invisible until now because every previously-pulled workload image
# is public (hits policy.json's insecureAcceptAnything default branch), and
# the OS image itself reaches the device via `bootc switch`'s own separate
# ostree-based pull mechanism, not CRI-O's kubelet pull path.
#
# See: `man containers-registries.d`, DECISIONS.md D018.
docker:
  default-route-openshift-image-registry.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com:
    use-sigstore-attachments: true
