# This project was developed with assistance from AI tools.
extensions:
  file_storage:
    directory: /var/lib/otel-queue
    timeout: 10s

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
      grpc:
        endpoint: 127.0.0.1:4317
  prometheus:
    config:
      scrape_configs:
        - job_name: vllm
          scrape_interval: 30s
          static_configs:
            - targets: ["127.0.0.1:30800"]
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      load: {}
      network: {}
  journald:
    units:
      - microshift
      - crio
      - flightctl-agent
      - nvidia-gpu-reset

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 10s
    send_batch_size: 512
  resource:
    attributes:
      - key: device.id
        value: thor
        action: upsert
      - key: device.type
        value: jetson-agx-thor
        action: upsert
      - key: model.version
        value: cosmos3-edge-v1
        action: upsert

exporters:
  otlphttp:
    endpoint: https://otlp-http-edge-gateway-route-observability.apps.g4h4d3j7q1c9f7m.cimo.p1.openshiftapps.com
    tls:
      insecure_skip_verify: true
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 0
  debug:
    verbosity: basic

service:
  extensions: [file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp, debug]
    metrics:
      receivers: [prometheus, hostmetrics]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
    logs:
      receivers: [journald]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp]
